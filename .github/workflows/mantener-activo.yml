name: Mantener activa la base de datos
# Supabase gratis se pausa tras 7 días sin uso; esto hace una consulta ligera cada 3 días.
on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "https://itxkuljjsbszxpwyxlse.supabase.co/rest/v1/clientes?select=id&limit=1" \
            -H "apikey: sb_publishable_tULMJQPr8toCuYi1Z_8m3g_eEUGq_pV"
