<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3F5A9E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="App Contaduría de Sol-EMP Soluciones Empresariales: IVA, ISR, facturas y declaración anual.">
<title>Sol-EMP · App Contaduría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: una sola columna amplia, tarjetas con aire; resumen arriba, detalle abajo. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#15192A; --muted:#5B6378; --line:#E0E4EE;
  --accent:#3F5A9E; --accent-soft:#E5EAF6; --on-accent:#FFFFFF;
  --pay:#A9412C; --pay-soft:#F6E5E0; --favor:#2A7550; --favor-soft:#E0F0E6; --warn:#8C6200; --warn-soft:#F8EED3;
  --font-d:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-b:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --surface:#181C28; --ink:#E7EAF2; --muted:#9AA2B6; --line:#2A3042;
    --accent:#9DB2E8; --accent-soft:#232C45; --on-accent:#10162A;
    --pay:#EE8B74; --pay-soft:#3A231E; --favor:#7BCFA0; --favor-soft:#1A3124; --warn:#E3B650; --warn-soft:#352C16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131C; --surface:#181C28; --ink:#E7EAF2; --muted:#9AA2B6; --line:#2A3042;
  --accent:#9DB2E8; --accent-soft:#232C45; --on-accent:#10162A;
  --pay:#EE8B74; --pay-soft:#3A231E; --favor:#7BCFA0; --favor-soft:#1A3124; --warn:#E3B650; --warn-soft:#352C16;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.v,.big{font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:22px 18px 96px;display:flex;flex-direction:column;gap:26px}
.top{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ttl{font-size:1.5rem;font-weight:800}
.ttl small{display:block;font-family:var(--font-b);font-weight:400;color:var(--muted);font-size:.88rem;letter-spacing:0;margin-top:2px}
.logo{width:118px;height:auto;background:#fff;border-radius:12px;padding:6px 8px;border:1px solid var(--line);flex:none}
.brand small{display:block;font-family:var(--font-b);font-weight:400;color:var(--muted);font-size:.85rem;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.pay{background:var(--pay-soft);color:var(--pay)}
.chip.favor{background:var(--favor-soft);color:var(--favor)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mute{background:var(--line);color:var(--muted)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.period label{font-size:.85rem;color:var(--muted)}
.period select{flex:1;border:0;background:transparent;font-family:var(--font-d);font-weight:700;font-size:1.05rem;padding:4px 0;min-height:36px}
.period .due{flex-basis:100%;font-size:.82rem;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--font-d);font-size:1.35rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:1.1rem}
.list{display:flex;flex-direction:column;gap:12px}
.client{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer}
.client:hover,.inv:hover{border-color:var(--accent)}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;flex:none}
.client .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.client .info strong{overflow-wrap:anywhere}
.client .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.client .amt b{font-variant-numeric:tabular-nums;font-family:var(--font-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--pay);border-color:var(--pay-soft)}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .primary{grid-column:1 / -1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:flex;flex-direction:column;gap:18px}
.hero .label{font-size:.88rem;color:var(--muted)}
.big{font-family:var(--font-d);font-weight:800;font-size:2.4rem;line-height:1.1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.split div{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split span{font-size:.78rem;color:var(--muted)}
.split b{font-variant-numeric:tabular-nums;font-size:.98rem;overflow-wrap:anywhere}
.notes{display:flex;flex-direction:column;gap:8px}
.note{font-size:.88rem;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin:0}
.note.info{background:var(--accent-soft);color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;padding:4px 2px}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
table.calc{width:100%;border-collapse:collapse}
table.calc td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.calc td.v{text-align:right;white-space:nowrap;padding-left:14px}
table.calc tr.total td{border-bottom:0;font-weight:700;font-family:var(--font-d);padding-top:14px;font-size:1.05rem}
table.calc tr.sub td{color:var(--muted);font-size:.9rem}
.scroll{overflow-x:auto}
table.months{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums;min-width:420px}
table.months th{font-weight:500;color:var(--muted);text-align:right;padding:8px 0 8px 10px;border-bottom:1px solid var(--line)}
table.months th:first-child,table.months td:first-child{text-align:left;padding-left:0}
table.months td{text-align:right;padding:8px 0 8px 10px;border-bottom:1px solid var(--line)}
table.months tr.t td{font-weight:700;border-bottom:0}
.card h3{font-size:1rem;margin-bottom:6px}
.inv{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.inv .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.inv .info strong{font-weight:600;overflow-wrap:anywhere}
.inv .tags{display:flex;flex-wrap:wrap;gap:6px}
.inv .amt{text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.empty{text-align:center;padding:34px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{margin:0;max-width:44ch}
.overlay{position:fixed;inset:0;background:rgba(12,15,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px 28px;display:flex;flex-direction:column;gap:18px}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{font-size:1.15rem}
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);border-radius:14px;padding:16px;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
legend{font-family:var(--font-d);font-weight:700;padding:0 6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.85rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:38px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.con{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.con .field input,.con .field select{background:var(--surface)}
.tot{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-variant-numeric:tabular-nums;font-size:.95rem}
.tot dt{color:var(--muted)} .tot dd{margin:0;text-align:right}
.tot .gt{font-family:var(--font-d);font-weight:800;font-size:1.15rem;color:var(--ink)}
pre.report{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:16px;font-size:.82rem;line-height:1.55;margin:0;font-family:ui-monospace,"SF Mono",Menlo,monospace;overflow-x:auto}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
/* Documento (factura / recibo) */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;font-size:.88rem}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.doc .dt{font-family:var(--font-d);font-weight:800;font-size:1.05rem;color:var(--accent);text-align:right}
.doc .blk{display:flex;flex-direction:column;gap:2px}
.doc .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th{font-weight:500;color:var(--muted);text-align:left;font-size:.75rem;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.doc td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.doc .r{text-align:right}
.doc .letra{font-size:.8rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.foot{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.6}
@media (max-width:420px){.big{font-size:2rem}.split{gap:8px}.split div{padding:10px}.split b{font-size:.88rem}.three{grid-template-columns:1fr 1fr}.tabs button{font-size:.82rem}}

/* ===== Apartados: navegación inferior, inicio, servicios, contacto ===== */
.wrap{padding-bottom:140px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--muted);padding:7px 0 6px;border-radius:14px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top-mini{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-mini .logo{width:104px}
.hero-sol{position:relative;overflow:hidden;border-radius:24px;padding:30px 24px 28px;color:#fff;background:linear-gradient(155deg,#4C68B0 0%,#2D4079 100%);display:flex;flex-direction:column;gap:20px}
.hero-sol::before{content:"";position:absolute;right:-90px;top:-70px;width:280px;height:280px;border-radius:50%;border:38px solid rgba(255,255,255,.07)}
.hero-sol::after{content:"";position:absolute;left:-60px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero-sol>*{position:relative}
.hero-sol .eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;opacity:.8}
.hero-sol h1{font-size:2rem;line-height:1.12;font-weight:800;color:#fff}
.hero-sol p{margin:0;opacity:.88;max-width:40ch}
.hero-sol .areas{display:flex;flex-wrap:wrap;gap:8px}
.hero-sol .areas span{font-size:.78rem;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.hero-sol .cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-sol .cta .btn{white-space:nowrap;padding:10px 12px}
.btn.on-blue{background:#fff;color:#2D4079;border-color:#fff}
.btn.on-blue-o{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.sec-t{display:flex;flex-direction:column;gap:4px}
.sec-t .eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sec-t h2{font-size:1.35rem}
.sec-t p{margin:0;color:var(--muted)}
.svc-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.svc-grid{grid-template-columns:1fr 1fr}}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;width:100%}
.svc:hover{border-color:var(--accent)}
.svc .ib{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.svc h3{font-size:1.02rem;margin:0}
.svc p{margin:0;color:var(--muted);font-size:.92rem}
.svc .more{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:.88rem;margin-top:auto}
.svc .more .ic{width:16px;height:16px}
.mvv{display:grid;gap:14px}
.mvv .card{display:flex;flex-direction:column;gap:8px}
.mvv .card h3{display:flex;align-items:center;gap:10px;margin:0}
.mvv .card p{margin:0;color:var(--muted)}
.dates{display:flex;flex-direction:column;gap:2px}
.date-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.date-row:last-child{border-bottom:0}
.dbadge{width:54px;flex:none;border-radius:14px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:8px 0;display:flex;flex-direction:column;line-height:1.1}
.dbadge b{font-family:var(--font-d);font-size:1.3rem}
.dbadge span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.date-row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct-list{display:flex;flex-direction:column}
.ct{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.ct:last-child{border-bottom:0}
.ct .ib{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ct .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct .info b{font-weight:600;overflow-wrap:anywhere}
.ct .go{color:var(--muted)}
.social{display:flex;gap:10px;flex-wrap:wrap}
.social a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:.9rem}
.social a:hover{border-color:var(--accent)}
.social .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.7rem;font-weight:800;font-family:var(--font-d)}
.sig{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:6px}
.sig .logo{width:120px}
.sig small{color:var(--muted);font-size:.8rem;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Entrada: el logo se arma por partes (trazos, texto, EMP), brillo, y la cortina sube */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:radial-gradient(120% 70% at 50% 45%,#FFFFFF 0%,#F4F6FC 60%,#E9EEF9 100%);
  animation:spOut .85s cubic-bezier(.76,0,.24,1) 2.55s forwards}
#splash::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:linear-gradient(90deg,#3F5A9E,#7C95D3,#3F5A9E)}
#splash .sp{position:relative;width:min(330px,78vw);display:flex;flex-direction:column;align-items:center;gap:30px}
#splash .lg{position:relative;width:100%;aspect-ratio:600/394;animation:spSettle 2.4s cubic-bezier(.2,.8,.2,1) both}
#splash .lg img,#splash .shine{position:absolute;inset:0;width:100%;height:100%}
#splash .sw{-webkit-mask-image:linear-gradient(58deg,#000 42%,transparent 58%);mask-image:linear-gradient(58deg,#000 42%,transparent 58%);
  -webkit-mask-size:260% 260%;mask-size:260% 260%;-webkit-mask-position:100% 100%;mask-position:100% 100%;animation:spWipe 1s cubic-bezier(.65,0,.25,1) .2s forwards}
#splash .dk{opacity:0;transform:translateY(14px);filter:blur(8px);animation:spRise .75s cubic-bezier(.2,.8,.2,1) .8s forwards}
#splash .em{opacity:0;transform:translateX(26px);animation:spSlide .7s cubic-bezier(.2,.8,.2,1) 1.15s forwards}
#splash .shine{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:130% 0;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;animation:spShine .9s ease-in-out 1.7s forwards}
#splash .tag{font-family:var(--font-b);font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:#5B6378;opacity:0;animation:spTag .7s ease 1.55s forwards}
@keyframes spWipe{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes spRise{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes spSlide{to{opacity:1;transform:none}}
@keyframes spShine{to{background-position:-30% 0}}
@keyframes spSettle{0%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes spTag{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:.32em}}
@keyframes spOut{to{transform:translateY(-100%)}}
#app.intro>*{animation:upIn .75s cubic-bezier(.2,.8,.2,1) backwards}
#app.intro>*:nth-child(1){animation-delay:2.95s}#app.intro>*:nth-child(2){animation-delay:3.03s}#app.intro>*:nth-child(3){animation-delay:3.11s}
#app.intro>*:nth-child(4){animation-delay:3.19s}#app.intro>*:nth-child(5){animation-delay:3.27s}#app.intro>*:nth-child(n+6){animation-delay:3.35s}
@keyframes upIn{from{opacity:0;transform:translateY(22px)}}
@media (prefers-reduced-motion:reduce){#splash{display:none}#app.intro>*{animation:none}}

</style>

function letras(n){
  const U=["","UN","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIÚN","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
  const D=["","","","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const C=["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  const cien=x=>{if(!x)return"";if(x===100)return"CIEN";const c=Math.floor(x/100),r=x%100;let s=C[c];if(r)s+=(s?" ":"")+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?" Y "+U[r%10]:""));return s};
  const mil=x=>{const m=Math.floor(x/1000),r=x%1000;let s="";if(m)s=m===1?"MIL":cien(m)+" MIL";if(r)s+=(s?" ":"")+cien(r);return s};
  const cents=Math.round(Math.abs(n)*100),ent=Math.floor(cents/100),ct=cents%100;
  const mi=Math.floor(ent/1e6),rest=ent%1e6;let s="";
  if(mi)s=mi===1?"UN MILLÓN":mil(mi)+" MILLONES";
  if(rest)s+=(s?" ":"")+mil(rest);else if(mi)s+=" DE";
  if(!s)s="CERO";
  return s+(ent===1?" PESO ":" PESOS ")+pad(ct)+"/100 M.N.";
}

  delete S.clientes[id];if(DB)await colC.doc(id).delete();else localSave();
}
const facturasDe=cid=>Object.values(S.facturas).filter(f=>f.cid===cid);
const docsDe=cid=>Object.values(S.docs).filter(d=>d.cid===cid);
const clientesOrden=()=>Object.values(S.clientes).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));

/* ================= Cálculo mensual ================= */
const ymOf=m=>YEAR+"-"+pad(m);
const inR=(ym,a,b)=>ym>=a&&ym<=b;
function pagado(f){if(f.metodo!=="PPD")return f.total;return(f.pagos||[]).reduce((t,p)=>t+p.imp,0)}
const pendiente=f=>f.dir!=="nomina"&&f.metodo==="PPD"&&pagado(f)<f.total-0.5;
function share(f,a,b){
  if(f.metodo!=="PPD")return inR(f.fecha.slice(0,7),a,b)?1:0;
  if(!f.total)return 0;let s=0;
  for(const p of f.pagos||[])if(inR(p.fecha.slice(0,7),a,b))s+=p.imp;
  return Math.min(1,s/f.total);
}
// flujo (cobrado/pagado) o devengado (fecha de la factura, personas morales)
function agg(fs,dir,a,b,soloDed,dev){
  const o={base:0,iva:0,ivaRet:0,isrRet:0,n:0};
  for(const f of fs){
    if(f.dir!==dir)continue;
    if(soloDed&&f.deducible===false)continue;
    const k=dev?(inR(f.fecha.slice(0,7),a,b)?1:0):share(f,a,b);if(!k)continue;
    const sg=f.tipo==="E"?-1:1;
    o.base+=sg*k*(f.subtotal-(f.descuento||0));o.iva+=sg*k*f.iva;o.ivaRet+=sg*k*f.ivaRet;o.isrRet+=sg*k*f.isrRet;o.n++;
  }
  return o;
}
function aggNom(fs,a,b){
  const o={grav:0,exen:0,isr:0,sub:0,n:0};
  for(const f of fs){if(f.dir!=="nomina"||!inR(f.fecha.slice(0,7),a,b))continue;o.grav+=f.gravado||0;o.exen+=f.exento||0;o.isr+=f.isrRet||0;o.sub+=f.subsidio||0;o.n++}
  return o;
}
function tarifa(base,k,tabla){
  tabla=tabla||TARIFA;
  if(base<=0)return{li:0,exc:0,pct:0,marg:0,cuota:0,isr:0};
  let r=tabla[0];for(const t of tabla)if(base>=t[0]*k)r=t;
  const li=r[0]*k,exc=base-li,marg=exc*r[2]/100,cuota=r[1]*k;
  return{li,exc,pct:r[2],marg,cuota,isr:marg+cuota};
}
const tasaDe=(tabla,ing)=>{for(const[l,t]of tabla)if(ing<=l)return t;return 2.5};
const tarifaRows=(t,etq)=>[[etq||"Límite inferior",-t.li,"sub"],["Excedente",t.exc,"sub"],["% sobre excedente",t.pct.toFixed(2)+" %","sub"],["Impuesto marginal",t.marg,"sub"],["Cuota fija",t.cuota,"sub"]];

function calc(c,m){
  const ym=ymOf(m),y0=ymOf(1),fs=facturasDe(c.id);
  const E=agg(fs,"emitida",ym,ym),R=agg(fs,"recibida",ym,ym,true),Rt=agg(fs,"recibida",ym,ym),N=aggNom(fs,ym,ym);
  const iva={tras:E.iva,ret:E.ivaRet,acred:R.iva};
  iva.neto=iva.tras-iva.ret-iva.acred;iva.cargo=Math.max(0,iva.neto);iva.favor=Math.max(0,-iva.neto);
  const notes=[];let isr;const reg=c.regimen;
  if(reg==="626"){
    const tasa=tasaDe(RESICO,E.base),causado=Math.max(0,E.base)*tasa/100,pagar=Math.max(0,causado-E.isrRet);
    const acum=agg(fs,"emitida",y0,ym).base;
    if(acum>3500000)notes.push(["warn","Los ingresos del año ("+money(acum)+") ya pasan el límite de RESICO de $3,500,000. Revisa el cambio de régimen."]);
    else if(acum>3000000)notes.push(["warn","Ingresos del año en "+money(acum)+": cerca del límite de RESICO de $3,500,000."]);
    isr={titulo:"ISR · RESICO (pago mensual definitivo)",pagar,rows:[
      ["Ingresos cobrados del mes (sin IVA)",E.base],["Tasa RESICO según ingresos del mes",tasa.toFixed(2)+" %","sub"],
      ["ISR del mes",causado],["ISR retenido por personas morales",-E.isrRet],["ISR a pagar",pagar,"total"]]};
  }else if(reg==="612"){
    let prev=0,L;
    for(let k=1;k<=m;k++){
      const b=ymOf(k),Ea=agg(fs,"emitida",y0,b),Ra=agg(fs,"recibida",y0,b,true);
      const base=Math.max(0,Ea.base-Ra.base),t=tarifa(base,k),pago=Math.max(0,t.isr-Ea.isrRet-prev);
      L={Ea,Ra,base,t,prev,pago,perd:Ra.base>Ea.base};prev+=pago;
    }
    if(L.perd)notes.push(["info","Los gastos acumulados superan a los ingresos: no hay utilidad, no se paga ISR este mes."]);
    isr={titulo:"ISR · Pago provisional (enero a "+MESES[m-1].toLowerCase()+")",pagar:L.pago,rows:[
      ["Ingresos cobrados acumulados",L.Ea.base],["Deducciones pagadas acumuladas",-L.Ra.base],["Utilidad (base gravable)",L.base],
      ...tarifaRows(L.t,"Límite inferior ("+m+(m>1?" meses)":" mes)")),
      ["ISR causado acumulado",L.t.isr],["ISR retenido acumulado",-L.Ea.isrRet],["Pagos provisionales anteriores",-L.prev],["ISR a pagar",L.pago,"total"]]};
  }else if(reg==="606"){
    const ciega=c.deduccion!=="real",ded=ciega?Math.max(0,E.base)*0.35:R.base;
    const base=Math.max(0,E.base-ded),t=tarifa(base,1),pagar=Math.max(0,t.isr-E.isrRet);
    isr={titulo:"ISR · Arrendamiento (pago provisional mensual)",pagar,rows:[
      ["Rentas cobradas del mes",E.base],[ciega?"Deducción opcional (35 %)":"Gastos deducibles pagados",-ded],["Base gravable",base],
      ...tarifaRows(t),["ISR causado",t.isr],["ISR retenido",-E.isrRet],["ISR a pagar",pagar,"total"]]};
  }else if(reg==="625"){
    const tasa=num(c.platTasa||"2.5"),causado=Math.max(0,E.base)*tasa/100,pagar=Math.max(0,causado-E.isrRet);
    if(c.definitivo)notes.push(["info","Este cliente eligió que las retenciones de las plataformas sean pago definitivo."]);
    isr={titulo:"ISR · Plataformas tecnológicas",pagar,rows:[
      ["Ingresos del mes por plataformas (sin IVA)",E.base],["Tasa de retención",tasa.toFixed(2)+" %","sub"],
      ["ISR del mes",causado],["ISR retenido por las plataformas",-E.isrRet],["ISR a pagar",pagar,"total"]]};
  }else if(reg==="605"){
    isr={titulo:"Sueldos y salarios · lo retiene el patrón",pagar:0,rows:[
      ["Percepciones gravadas del mes",N.grav],["Percepciones exentas del mes",N.exen,"sub"],
      ["ISR retenido por el patrón",N.isr],["Subsidio para el empleo aplicado",N.sub,"sub"],["ISR a pagar por el trabajador","Ninguno (el patrón lo entera)","total"]]};
    if(!N.n)notes.push(["info","Sube los XML de nómina del trabajador para llevar su control y su declaración anual."]);
  }else{ // 601 persona moral
    const coef=num(c.coef);let prev=0,L;
    for(let k=1;k<=m;k++){
      const b=ymOf(k),Ea=agg(fs,"emitida",y0,b,false,true);
      const util=Math.max(0,Ea.base)*coef,isrC=util*0.30,pago=Math.max(0,isrC-Ea.isrRet-prev);
      L={Ea,util,isrC,prev,pago};prev+=pago;
    }
    if(!coef)notes.push(["warn","Falta el coeficiente de utilidad de este cliente. Agrégalo en Editar cliente."]);
    isr={titulo:"ISR · Persona moral (pago provisional)",pagar:L.pago,rows:[
      ["Ingresos nominales acumulados (facturados)",L.Ea.base],["Coeficiente de utilidad",coef.toFixed(4),"sub"],["Utilidad fiscal estimada",L.util],
      ["ISR acumulado (30 %)",L.isrC],["ISR retenido acumulado",-L.Ea.isrRet],["Pagos provisionales anteriores",-L.prev],["ISR a pagar",L.pago,"total"]]};
  }
  const retEnt=Math.max(0,Rt.isrRet)+Math.max(0,Rt.ivaRet);
  const pend=fs.filter(pendiente).length;
  if(pend)notes.push(["warn",pend+(pend===1?" factura a crédito (PPD) sigue":" facturas a crédito (PPD) siguen")+" sin cobro o pago completo. No cuentan hasta que se registre su pago."]);
  if(iva.favor>0)notes.push(["info","IVA a favor de "+money(iva.favor)+": puedes acreditarlo en meses siguientes o pedir devolución."]);
  return{ym,E,R,Rt,N,iva,isr,retEnt,total:iva.cargo+isr.pagar+retEnt,notes,movs:E.n+Rt.n+N.n,fs};
}
function estado(r,c){
  if(!r.movs)return["mute","Sin movimientos"];
  if(c&&c.regimen==="605")return["mute","Sin pago mensual"];
  if(r.total>0.5)return["pay","Por pagar"];
  if(r.iva.favor>0.5)return["favor","Saldo a favor"];
  return["favor","En ceros"];
}
function vence(m){const nm=m===12?1:m+1,ny=m===12?YEAR+1:YEAR;return"17 de "+MESES[nm-1].toLowerCase()+" de "+ny}

/* ================= Cálculo anual ================= */
function anual(c){
  const fs=facturasDe(c.id),a=ymOf(1),b=ymOf(12),reg=c.regimen;
  const E=agg(fs,"emitida",a,b),R=agg(fs,"recibida",a,b,true),N=aggNom(fs,a,b);
  const meses=[];let pagos=0;
  for(let m=1;m<=12;m++){const r=calc(c,m);meses.push({m,ing:r.E.base+r.N.grav+r.N.exen,iva:r.iva.neto,isr:r.isr.pagar});pagos+=r.isr.pagar}
  const notes=[],rows=[];let res,titulo,vence;
  const hoy=new Date();if(hoy.getFullYear()<=YEAR)notes.push(["info","El año "+YEAR+" aún no termina: este cálculo usa lo cargado hasta hoy y se ajusta con cada mes nuevo."]);
  if(reg==="626"){
    const tasa=tasaDe(RESICO_ANUAL,E.base),isr=Math.max(0,E.base)*tasa/100;
    res=isr-E.isrRet-pagos;titulo="Anual RESICO";vence="30 de abril de "+(YEAR+1);
    rows.push(["Ingresos cobrados del año",E.base],["Tasa anual RESICO",tasa.toFixed(2)+" %","sub"],["ISR del ejercicio",isr],["ISR retenido por personas morales",-E.isrRet],["Pagos mensuales hechos",-pagos]);
    if(N.n)notes.push(["info","Los sueldos de este cliente se declaran aparte del RESICO."]);
  }else if(reg==="601"){
    const Ed=agg(fs,"emitida",a,b,false,true),Rd=agg(fs,"recibida",a,b,true,true);
    const util=Ed.base-Rd.base,isr=Math.max(0,util)*0.30;
    res=isr-Ed.isrRet-pagos;titulo="Anual persona moral";vence="31 de marzo de "+(YEAR+1);
    rows.push(["Ingresos acumulables (facturados)",Ed.base],["Deducciones autorizadas (facturadas)",-Rd.base],[util>=0?"Utilidad fiscal":"Pérdida fiscal",util],["ISR del ejercicio (30 %)",isr],["ISR retenido",-Ed.isrRet],["Pagos provisionales hechos",-pagos]);
    notes.push(["warn","Revisa ajuste anual por inflación, PTU, depreciaciones y pérdidas de años anteriores: aquí no se incluyen."]);
    if(util>0)notes.push(["info","Coeficiente de utilidad para "+(YEAR+1)+": "+(Ed.base>0?(util/Ed.base).toFixed(4):"0.0000")+" (utilidad entre ingresos nominales)."]);
  }else if(reg==="625"&&c.definitivo){
    titulo="Plataformas (pago definitivo)";vence="30 de abril de "+(YEAR+1);
    rows.push(["Ingresos por plataformas del año",E.base],["ISR retenido por plataformas",E.isrRet,"sub"]);
    if(N.n){const t=tarifa(N.grav,1,TARIFA_ANUAL);res=t.isr-N.isr;rows.push(["Sueldos gravados del año",N.grav],...tarifaRows(t),["ISR de sueldos",t.isr],["ISR retenido por el patrón",-N.isr])}
    else res=0;
    notes.push(["info","Las retenciones de plataformas son pago definitivo: esos ingresos no se suman en la anual."]);
  }else{
    // personas físicas: 612, 606, 605, 625 sin pago definitivo; suma sueldos si los hay
    let util=0,etq="";
    if(reg==="612"||reg==="625"){util=Math.max(0,E.base-R.base);etq=reg==="612"?"Utilidad de actividad empresarial":"Utilidad por plataformas";
      rows.push(["Ingresos cobrados del año",E.base],["Deducciones pagadas del año",-R.base],[etq,util])}
    else if(reg==="606"){const ded=c.deduccion!=="real"?Math.max(0,E.base)*0.35:R.base;util=Math.max(0,E.base-ded);
      rows.push(["Rentas cobradas del año",E.base],[c.deduccion!=="real"?"Deducción opcional (35 %)":"Gastos deducibles",-ded],["Utilidad por arrendamiento",util])}
    if(N.n||reg==="605")rows.push(["Sueldos gravados del año",N.grav]);
    const ingTot=Math.max(0,E.base)+N.grav+N.exen,tope=Math.min(5*UMA_ANUAL,ingTot*0.15);
    const dp=Math.min(num(c.dedPers),tope);
    const base=Math.max(0,util+N.grav-dp),t=tarifa(base,1,TARIFA_ANUAL);
    if(num(c.dedPers)>tope)notes.push(["warn","Las deducciones personales capturadas ("+money(num(c.dedPers))+") pasan el tope de "+money(tope)+"; se usa el tope."]);
    rows.push(["Deducciones personales (tope "+money(tope)+")",-dp],["Base gravable anual",base],...tarifaRows(t),["ISR del ejercicio",t.isr],
      ["ISR retenido (clientes y patrón)",-(E.isrRet+N.isr)],["Pagos provisionales hechos",-pagos]);
    res=t.isr-E.isrRet-N.isr-pagos;titulo="Anual persona física";vence="30 de abril de "+(YEAR+1);
  }
  rows.push([res>=0?"ISR a cargo":"Saldo a favor",Math.abs(res),"total"]);
  return{titulo,rows,res,notes,meses,vence,pagos};
}

/* ================= Lectura de CFDI ================= */
function parseCFDI(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("xml");
  const c=doc.documentElement;if(!c||c.localName!=="Comprobante")throw new Error("nocfdi");
  const A=(el,n)=>el?el.getAttribute(n):null;
  const kid=(el,n)=>el?[...el.children].find(e=>e.localName===n):null;
  const tfd=doc.getElementsByTagNameNS("*","TimbreFiscalDigital")[0];
  const moneda=A(c,"Moneda")||"MXN",tc=(moneda==="MXN"||moneda==="XXX")?1:(num(A(c,"TipoCambio"))||1);
  const em=kid(c,"Emisor"),re=kid(c,"Receptor"),imp=kid(c,"Impuestos");
  let iva=0,ivaRet=0,isrRet=0;
  if(imp){
    const tr=kid(imp,"Traslados");if(tr)for(const t of tr.children)if(A(t,"Impuesto")==="002")iva+=num(A(t,"Importe"));
    const rt=kid(imp,"Retenciones");if(rt)for(const r of rt.children){const v=num(A(r,"Importe"));if(A(r,"Impuesto")==="001")isrRet+=v;else if(A(r,"Impuesto")==="002")ivaRet+=v}
  }
  const o={uuid:(A(tfd,"UUID")||"").toUpperCase(),tipo:A(c,"TipoDeComprobante"),fecha:(A(c,"Fecha")||"").slice(0,10),
    folio:[A(c,"Serie"),A(c,"Folio")].filter(Boolean).join("-"),
    emRfc:(A(em,"Rfc")||"").toUpperCase(),emNom:A(em,"Nombre")||"",reRfc:(A(re,"Rfc")||"").toUpperCase(),reNom:A(re,"Nombre")||"",
    subtotal:num(A(c,"SubTotal"))*tc,descuento:num(A(c,"Descuento"))*tc,total:num(A(c,"Total"))*tc,
    iva:iva*tc,ivaRet:ivaRet*tc,isrRet:isrRet*tc,metodo:A(c,"MetodoPago")||"PUE",moneda,tc,pagos:[]};
  if(o.tipo==="P"){
    for(const p of doc.getElementsByTagNameNS("*","Pago")){
      const fp=(A(p,"FechaPago")||"").slice(0,10);
      for(const d of p.getElementsByTagNameNS("*","DoctoRelacionado"))o.pagos.push({rel:(A(d,"IdDocumento")||"").toUpperCase(),fecha:fp,imp:num(A(d,"ImpPagado"))});
    }
  }
  if(o.tipo==="N"){
    const nom=doc.getElementsByTagNameNS("*","Nomina")[0];
    if(nom){
      const per=kid(nom,"Percepciones"),ded=kid(nom,"Deducciones"),otr=kid(nom,"OtrosPagos");
      o.fecha=(A(nom,"FechaPago")||o.fecha).slice(0,10);
      o.gravado=num(A(per,"TotalGravado"));o.exento=num(A(per,"TotalExento"));
      o.isrNom=num(A(ded,"TotalImpuestosRetenidos"));
      let sub=0;if(otr)for(const op of otr.children){const s=kid(op,"SubsidioAlEmpleo");if(s)sub+=num(A(op,"Importe"))}
      o.subsidio=sub;
    }
  }
  return o;
}
async function leerArchivos(files){
  const out=[];
  for(const f of files){
    const n=f.name.toLowerCase();
    if(n.endsWith(".zip")){
      if(!window.JSZip){out.push({err:"zip"});continue}
      try{const z=await JSZip.loadAsync(f);for(const e of Object.values(z.files))if(!e.dir&&e.name.toLowerCase().endsWith(".xml"))out.push({text:await e.async("string")})}catch(e){out.push({err:"zip"})}
    }else out.push({text:await f.text()});
  }
  return out;
}
async function importar(files,cid){
  const c=S.clientes[cid];if(!c)return;
  toast("Leyendo archivos…",60000);
  const raw=await leerArchivos(files);
  const R={nuevas:0,nom:0,rep:0,pagos:0,sinRel:0,ajeno:0,otros:0,mal:0,reemp:0};
  const docs=[];
  for(const r of raw){if(r.err){R.mal++;continue}try{docs.push(parseCFDI(r.text))}catch(e){R.mal++}}
  const rfc=c.rfc.toUpperCase();
  let i=0;const total=docs.length;
  try{
    for(const d of docs.filter(d=>d.tipo==="I"||d.tipo==="E")){
      i++;if(i%5===0)toast("Guardando "+i+" de "+total+"…",60000);
      let dir=null;if(d.emRfc===rfc)dir="emitida";else if(d.reRfc===rfc)dir="recibida";
      if(!dir){R.ajeno++;continue}
      const id=cid+"_"+(d.uuid||uid("x"));
      if(S.facturas[id]){R.rep++;continue}
      if(dir==="emitida"&&d.tipo==="I"){
        const prev=facturasDe(cid).find(f=>f.origen==="documento"&&f.rfc===d.reRfc&&Math.abs(f.total-d.total)<0.05&&f.fecha.slice(0,7)===d.fecha.slice(0,7));
        if(prev){await delFactura(prev.id);R.reemp++}
      }
      await putFactura({id,cid,uuid:d.uuid,dir,tipo:d.tipo,fecha:d.fecha,folio:d.folio,
        rfc:dir==="emitida"?d.reRfc:d.emRfc,nombre:dir==="emitida"?d.reNom:d.emNom,
        subtotal:d.subtotal,descuento:d.descuento,iva:d.iva,ivaRet:d.ivaRet,isrRet:d.isrRet,total:d.total,
        metodo:d.metodo==="PPD"?"PPD":"PUE",tc:d.tc,pagos:[],deducible:true,origen:"xml"});
      R.nuevas++;
    }
    for(const d of docs.filter(d=>d.tipo==="N")){
      if(d.reRfc!==rfc){R.ajeno++;continue}
      const id=cid+"_"+(d.uuid||uid("n"));
      if(S.facturas[id]){R.rep++;continue}
      await putFactura({id,cid,uuid:d.uuid,dir:"nomina",tipo:"N",fecha:d.fecha,folio:d.folio,rfc:d.emRfc,nombre:d.emNom,
        subtotal:d.subtotal,descuento:d.descuento,iva:0,ivaRet:0,isrRet:d.isrNom||0,total:d.total,metodo:"PUE",tc:1,pagos:[],
        gravado:d.gravado||0,exento:d.exento||0,subsidio:d.subsidio||0,origen:"xml"});
      R.nom++;
    }
    for(const d of docs.filter(d=>d.tipo==="P")){
      for(const p of d.pagos){
        const f=S.facturas[cid+"_"+p.rel];
        if(!f){R.sinRel++;continue}
        const ref=d.uuid+":"+p.rel;
        if((f.pagos||[]).some(x=>x.ref===ref))continue;
        const nf=clone(f);nf.pagos=(nf.pagos||[]).concat([{fecha:p.fecha,imp:p.imp*(f.tc||1),ref}]);
        await putFactura(nf);R.pagos++;
      }
    }
  }catch(e){toast(dbErr(e),5000)}
  R.otros=docs.filter(d=>!["I","E","P","N"].includes(d.tipo)).length;
  $("#toast").classList.remove("on");
  render();
  const li=[["Facturas agregadas",R.nuevas]];
  if(R.nom)li.push(["Recibos de nómina agregados",R.nom]);
  if(R.pagos)li.push(["Pagos aplicados a facturas a crédito",R.pagos]);
  if(R.reemp)li.push(["Registros manuales cambiados por su XML timbrado",R.reemp]);
  if(R.rep)li.push(["Ya estaban cargadas (se omitieron)",R.rep]);
  if(R.ajeno)li.push(["No son de este RFC ("+rfc+")",R.ajeno]);
  if(R.sinRel)li.push(["Complementos de pago sin su factura cargada",R.sinRel]);
  if(R.otros)li.push(["Otros tipos (no se usan aquí)",R.otros]);
  if(R.mal)li.push(["Archivos que no son CFDI válidos",R.mal]);
  openSheet("Carga terminada",`<dl class="kv">${li.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
    ${R.sinRel?`<p class="note small">Sube primero la factura PPD y luego su complemento de pago, o súbelos juntos.</p>`:""}
    <button class="btn primary full" data-act="close">Ver cálculo</button>`);
}

/* ================= Documentos: factura, recibo, cotización ================= */
function docTot(d){
  let sub=0;for(const k of d.conceptos)sub+=r2(num(k.cant)*num(k.precio));
  sub=r2(sub);const rate=d.ivaTasa==="exento"?0:num(d.ivaTasa)/100;
  const iva=r2(sub*rate),retIsr=r2(sub*num(d.retIsr)/100),retIva=r2(sub*num(d.retIva)/100);
  return{sub,iva,retIsr,retIva,total:r2(sub+iva-retIsr-retIva)};
}
function sugerirRet(c,rfc){
  const pm=(rfc||"").length===12;
  if(!pm)return{retIsr:"0",retIva:"0"};
  if(c.regimen==="626")return{retIsr:"1.25",retIva:"0"};
  if(c.regimen==="612"||c.regimen==="606")return{retIsr:"10",retIva:"10.6667"};
  return{retIsr:"0",retIva:"0"};
}

  d.conceptos.forEach(k=>L.push("• "+k.cant+" × "+k.desc+": "+money(num(k.cant)*num(k.precio))));
  L.push("","Subtotal: "+money(t.sub),"IVA: "+money(t.iva));

function proximasFechas(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const out=[];
  let y=hoy.getFullYear(),m=hoy.getMonth();
  let d=new Date(y,m,17);if(d<hoy)d=new Date(y,m+1,17);
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  out.push({d,t:"Declaración mensual de "+MESES[pm.getMonth()].toLowerCase(),s:"IVA, ISR y retenciones"});
  const d2=new Date(d.getFullYear(),d.getMonth()+1,17),pm2=new Date(d2.getFullYear(),d2.getMonth()-1,1);
  out.push({d:d2,t:"Declaración mensual de "+MESES[pm2.getMonth()].toLowerCase(),s:"IVA, ISR y retenciones"});
  let a=new Date(y,2,31);if(a<hoy)a=new Date(y+1,2,31);out.push({d:a,t:"Anual de personas morales",s:"Ejercicio "+(a.getFullYear()-1)});
  let b=new Date(y,3,30);if(b<hoy)b=new Date(y+1,3,30);out.push({d:b,t:"Anual de personas físicas",s:"Ejercicio "+(b.getFullYear()-1)});
  return out.sort((p,q)=>p.d-q.d).map(x=>({...x,dias:Math.round((x.d-hoy)/864e5)}));
}

/* ================= Vistas ================= */
function periodBar(){
  return`<div class="period"><label for="mes">Periodo</label>
    <select id="mes" data-change="mes">${MESES.map((n,i)=>`<option value="${i+1}"${i+1===S.m?" selected":""}>${n} ${YEAR}</option>`).join("")}</select>
    <div class="due">Se declara a más tardar el <b>${vence(S.m)}</b></div></div>`;
}
function storeChip(){
  if(S.mode==="cargando")return`<span class="chip mute">Cargando…</span>`;
  if(S.mode==="nube")return S.slow?`<span class="chip warn">Sin conexión</span>`:`<span class="chip">Guardado en tu cuenta</span>`;
  return`<span class="chip">Guardado en este dispositivo</span>`;
}
const header=()=>`<header class="top"><div class="brand"><img class="logo" src="${LOGO}" alt="Sol-EMP Soluciones Empresariales">${storeChip()}</div><h1 class="ttl">Área de trabajo<small>Impuestos, facturas y declaración anual · ${YEAR}</small></h1>${periodBar()}</header>`;
const foot=()=>`<p class="foot">Tarifas ${YEAR} del Anexo 8 de la RMF, tasas RESICO del art. 113-E LISR y UMA ${YEAR}.<br>Es una hoja de trabajo: revisa siempre contra la declaración en el portal del SAT.</p>`;
function viewHome(){
  const cs=clientesOrden();
  if(S.mode==="cargando")return header()+`<div class="card empty"><p class="muted">Cargando tus clientes…</p></div>`;
  let banner="";
  if(S.failed)banner=`<p class="note">No se pudo conectar con tu cuenta. Lo que hagas ahora se guarda solo en este dispositivo.</p>`;
  else if(S.slow)banner=`<p class="note">Tus datos tardan en llegar. Lo que ves puede no estar al día.</p>`;
  if(!cs.length)return header()+banner+`<div class="card empty">
      <h2>Agrega tu primer cliente</h2>
      <p class="muted">Registra a cada contribuyente con su RFC y régimen. Sube sus facturas en XML (o el ZIP del SAT) y la app saca el IVA, el ISR y su declaración anual. También puedes hacerle facturas, recibos y cotizaciones.</p>
      <button class="btn primary" data-act="nuevoCliente">Agregar cliente</button>
      <button class="btn ghost" data-act="ejemplo">Probar con un cliente de ejemplo</button></div>`+respaldoHTML()+foot();
  const rs=cs.map(c=>({c,r:calc(c,S.m)}));
  const tot=rs.reduce((t,x)=>t+x.r.total,0),porPagar=rs.filter(x=>x.r.total>0.5).length;
  return header()+banner+`
  <section class="tiles">
    <div class="tile"><span>Total a pagar · ${MESES[S.m-1]}</span><b>${money(tot)}</b></div>
    <div class="tile"><span>Clientes con pago</span><b>${porPagar} de ${cs.length}</b></div>
  </section>
  <section class="stack">
    <div class="sec-h"><h2>Clientes</h2><button class="btn ghost" data-act="nuevoCliente">+ Agregar</button></div>
    <div class="list">${rs.map(({c,r})=>{const[k,t]=estado(r,c);return`
      <button class="client" data-act="abrir" data-id="${esc(c.id)}">
        <span class="avatar" aria-hidden="true">${esc((c.nombre.trim()[0]||"?").toUpperCase())}</span>
        <span class="info"><strong>${esc(c.nombre)}</strong><span class="small muted">${esc(c.rfc)} · ${esc(REG[c.regimen].c)}${c.ejemplo?" · ejemplo":""}</span></span>
        <span class="amt"><b>${money(r.total)}</b><span class="chip ${k}">${t}</span></span>
      </button>`}).join("")}</div>
  </section>`+respaldoHTML()+foot();
}
function respaldoHTML(){
  return`<section class="card stack"><div class="stack" style="gap:4px"><h3 style="margin:0">Respaldo</h3>
    <p class="small muted" style="margin:0">Los datos se guardan en este celular. Descarga un respaldo de vez en cuando; si cambias de celular o borras el navegador, lo restauras aquí.</p></div>
    <div class="two">${(DL||STANDALONE)?`<button class="btn" data-act="respaldo">Descargar respaldo</button>`:`<button class="btn" data-act="copiarRespaldo">Copiar respaldo</button>`}<button class="btn" data-act="restaurar">Restaurar</button></div></section>`;
}
function rowsTable(rows){
  return`<table class="calc"><tbody>${rows.map(([l,v,k])=>{
    const val=typeof v==="number"?(v<0?"− "+money(-v):money(v)):esc(v);
    return`<tr class="${k||""}"><td>${esc(l)}</td><td class="v">${val}</td></tr>`}).join("")}</tbody></table>`;
}
const ivaRows=r=>[["IVA trasladado cobrado",r.iva.tras],["IVA retenido por clientes",-r.iva.ret],["IVA acreditable pagado",-r.iva.acred],[r.iva.neto>=0?"IVA a pagar":"IVA a favor",Math.abs(r.iva.neto),"total"]];
const notesHTML=ns=>ns.length?`<div class="notes">${ns.map(([k,t])=>`<p class="note ${k==="info"?"info":""}">${esc(t)}</p>`).join("")}</div>`:"";

function tabCalculo(r){
  return`${r.isr&&S.clientes[S.cid].regimen!=="605"?`<div class="card"><h3>IVA del mes</h3>${rowsTable(ivaRows(r))}</div>`:""}
    <div class="card"><h3>${esc(r.isr.titulo)}</h3>${rowsTable(r.isr.rows)}</div>
    ${r.retEnt>0.5?`<div class="card"><h3>Retenciones que este cliente debe enterar</h3>${rowsTable([["ISR retenido a proveedores",Math.max(0,r.Rt.isrRet)],["IVA retenido a proveedores",Math.max(0,r.Rt.ivaRet)],["Total a enterar",r.retEnt,"total"]])}</div>`:""}
    ${!r.movs?`<div class="card empty"><p class="muted">No hay movimientos en ${MESES[S.m-1].toLowerCase()}. Sube sus XML para calcular.</p></div>`:""}`;
}
function tabComprobantes(r){
  const enMes=r.fs.filter(f=>f.fecha.slice(0,7)===r.ym||(f.pagos||[]).some(p=>p.fecha.slice(0,7)===r.ym));
  const cnt={emitidas:enMes.filter(f=>f.dir==="emitida").length,recibidas:enMes.filter(f=>f.dir==="recibida").length,nomina:enMes.filter(f=>f.dir==="nomina").length,pendientes:r.fs.filter(pendiente).length};
  const map={emitidas:"emitida",recibidas:"recibida",nomina:"nomina"};
  const lista=(S.filtro==="pendientes"?r.fs.filter(pendiente):enMes.filter(f=>f.dir===map[S.filtro])).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const lbl={emitidas:"Emitidas",recibidas:"Recibidas",nomina:"Nómina",pendientes:"Por cobrar o pagar"};
  return`<div class="seg" role="group" aria-label="Filtrar comprobantes">${Object.keys(lbl).filter(k=>k!=="nomina"||cnt.nomina||S.clientes[S.cid].regimen==="605").map(k=>`<button data-act="filtro" data-f="${k}" aria-pressed="${S.filtro===k}">${lbl[k]} (${cnt[k]})</button>`).join("")}</div>
    <div class="list">${lista.length?lista.map(invItem).join(""):`<div class="card empty"><p class="muted">${S.filtro==="pendientes"?"No hay facturas a crédito pendientes.":"No hay comprobantes en este periodo."}</p></div>`}</div>`;
}
function tabFacturar(){
  const ds=docsDe(S.cid).sort((a,b)=>(b.fecha+b.folio).localeCompare(a.fecha+a.folio));
  return`<button class="btn primary full" data-act="nuevoDoc">Nueva factura, recibo o cotización</button>
    ${ds.length?`<div class="list">${ds.map(d=>{const t=docTot(d),T=TIPOS_DOC[d.tipo];const[y,mo,dd]=d.fecha.split("-");return`
      <button class="inv" data-act="verDoc" data-id="${esc(d.id)}"><span class="info"><strong>${esc(d.rec.nombre||"Sin nombre")}</strong>
        <span class="small muted">${T.t} ${T.s}-${d.folio} · ${dd}/${mo}/${y}</span>
        <span class="tags">${d.registrado?`<span class="chip favor">Registrado como ingreso</span>`:""}${d.tipo==="factura"?`<span class="chip mute">Por timbrar</span>`:""}${d.metodo==="PPD"&&d.tipo!=="cotizacion"?`<span class="chip warn">PPD</span>`:""}</span></span>
        <span class="amt"><b>${money(t.total)}</b><span class="small muted">IVA ${money(t.iva)}</span></span></button>`}).join("")}</div>`
      :`<div class="card empty"><p class="muted">Haz facturas listas para timbrar, recibos para clientes sin factura y cotizaciones. Con un toque las registras como ingreso del mes.</p></div>`}`;
}
function tabAnual(c){
  const a=anual(c);
  const showDed=!["626","601"].includes(c.regimen)&&!(c.regimen==="625"&&c.definitivo);
  const tm=a.meses.reduce((t,x)=>({ing:t.ing+x.ing,iva:t.iva+x.iva,isr:t.isr+x.isr}),{ing:0,iva:0,isr:0});
  return`<section class="card hero">
      <div class="stack" style="gap:4px"><span class="label">Declaración anual ${YEAR} · se presenta a más tardar el ${a.vence}</span>
        <span class="big" style="color:${a.res>0.5?"var(--pay)":"var(--favor)"}">${money(Math.abs(a.res))}</span>
        <span class="chip ${a.res>0.5?"pay":"favor"}" style="align-self:flex-start">${a.res>0.5?"A cargo":a.res<-0.5?"Saldo a favor":"En ceros"}</span></div>
      ${notesHTML(a.notes)}
    </section>
    ${showDed?`<div class="card stack"><div class="field"><label for="dedP">Deducciones personales del año (médicos, dentista, colegiaturas, intereses de hipoteca, seguros de gastos médicos, aportaciones al retiro, donativos)</label>
      <input id="dedP" data-change="dedPers" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(c.dedPers||"")}" placeholder="0.00"></div>
      <p class="small muted" style="margin:0">Tope: lo menor entre 5 UMA anuales (${money(5*UMA_ANUAL)}) y el 15 % de los ingresos del año.</p></div>`:""}
    <div class="card"><h3>${esc(a.titulo)}</h3>${rowsTable(a.rows)}</div>
    <div class="card"><h3>Mes por mes</h3><div class="scroll"><table class="months"><thead><tr><th>Mes</th><th>Ingresos</th><th>IVA</th><th>ISR pagado</th></tr></thead><tbody>
      ${a.meses.map(x=>`<tr><td>${MESES[x.m-1].slice(0,3)}</td><td>${money(x.ing)}</td><td>${x.iva<0?"− "+money(-x.iva):money(x.iva)}</td><td>${money(x.isr)}</td></tr>`).join("")}
      <tr class="t"><td>Total</td><td>${money(tm.ing)}</td><td>${tm.iva<0?"− "+money(-tm.iva):money(tm.iva)}</td><td>${money(tm.isr)}</td></tr></tbody></table></div>
      <p class="small muted" style="margin:10px 0 0">IVA negativo = saldo a favor de ese mes.</p></div>
    <button class="btn full" data-act="copiarAnual">Copiar resumen anual</button>`;
}
function viewCliente(){
  const c=S.clientes[S.cid];if(!c){S.view="home";return viewHome()}
  const r=calc(c,S.m),[k,t]=estado(r,c);
  const body=S.tab==="calculo"?tabCalculo(r):S.tab==="facturas"?tabComprobantes(r):S.tab==="facturar"?tabFacturar():tabAnual(c);
  const tabs=[["calculo","Mes"],["facturas","Comprobantes"],["facturar","Facturar"],["anual","Anual"]];
  return header()+`
  <div class="row between"><button class="btn ghost" data-act="home">← Clientes</button><button class="btn ghost" data-act="editCliente">Editar cliente</button></div>
  <section class="card hero">
    <div class="stack" style="gap:6px">
      <div class="row between"><h2 style="font-size:1.3rem;overflow-wrap:anywhere">${esc(c.nombre)}</h2><span class="chip ${k}">${t}</span></div>
      <span class="small muted">${esc(c.rfc)} · ${esc(REG[c.regimen].l)} (${c.regimen})</span>
    </div>
    <div class="stack" style="gap:4px"><span class="label">Total a pagar · ${MESES[S.m-1]} ${YEAR}</span><span class="big">${money(r.total)}</span></div>
    <div class="split">
      <div><span>${r.iva.neto>=0?"IVA":"IVA a favor"}</span><b>${money(r.iva.neto>=0?r.iva.cargo:r.iva.favor)}</b></div>
      <div><span>ISR</span><b>${money(r.isr.pagar)}</b></div>
      <div><span>Retenciones</span><b>${money(r.retEnt)}</b></div>
    </div>
    ${notesHTML(r.notes)}
  </section>
  <div class="actions">
    <button class="btn primary" data-act="subir">Subir XML o ZIP del SAT</button>
    <button class="btn" data-act="manual">Agregar a mano</button>
    <button class="btn" data-act="reporte">Sacar reporte</button>
  </div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-act="tab" data-t="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("")}</div>
  <section class="stack">${body}</section>`+foot();
}
function invItem(f){
  const tags=[];
  if(f.dir==="nomina")tags.push(`<span class="chip mute">Nómina</span>`);
  if(f.tipo==="E")tags.push(`<span class="chip mute">Nota de crédito</span>`);
  if(pendiente(f))tags.push(`<span class="chip warn">PPD · ${money(f.total-pagado(f))} pendiente</span>`);
  else if(f.metodo==="PPD")tags.push(`<span class="chip favor">PPD pagada</span>`);
  if(f.dir==="recibida"&&f.deducible===false)tags.push(`<span class="chip pay">No deducible</span>`);
  if(f.origen==="manual")tags.push(`<span class="chip mute">Manual</span>`);
  if(f.origen==="documento")tags.push(`<span class="chip mute">Hecha en la app</span>`);
  const[y,mo,d]=f.fecha.split("-");
  return`<button class="inv" data-act="factura" data-id="${esc(f.id)}">
    <span class="info"><strong>${esc(f.nombre||f.rfc||"Sin nombre")}</strong>
      <span class="small muted">${d}/${mo}/${y}${f.folio?" · "+esc(f.folio):""}${f.rfc?" · "+esc(f.rfc):""}</span>
      ${tags.length?`<span class="tags">${tags.join("")}</span>`:""}</span>
    <span class="amt"><b>${money((f.tipo==="E"?-1:1)*f.total)}</b><span class="small muted">${f.dir==="nomina"?"ISR "+money(f.isrRet):"IVA "+money(f.iva)}</span></span></button>`;
}
function render(){
  const v=S.sec==="inicio"?viewInicio():S.sec==="servicios"?viewServicios():S.sec==="contacto"?viewContacto():(S.view==="cliente"?viewCliente():viewHome());
  $("#app").innerHTML=v;renderNav();
}

/* ================= Hojas (formularios) ================= */
function openSheet(title,html){$("#sheetTitle").textContent=title;$("#sheetBody").innerHTML=html;$("#sheet").hidden=false}
function closeSheet(){$("#sheet").hidden=true;S.confirm=null;S.doc=null;render()}
function formCliente(c){
  c=c||{nombre:"",rfc:"",regimen:"626",deduccion:"ciega",cp:"",coef:"",platTasa:"2.5",definitivo:false};
  const v=r=>c.regimen===r?"":" hidden";
  openSheet(c.id?"Editar cliente":"Nuevo cliente",`<form id="fCliente">
    <input type="hidden" name="id" value="${esc(c.id||"")}">
    <div class="field"><label for="cNom">Nombre o razón social</label><input id="cNom" name="nombre" required value="${esc(c.nombre)}" autocomplete="off"></div>
    <div class="two"><div class="field"><label for="cRfc">RFC</label><input id="cRfc" name="rfc" required minlength="12" maxlength="13" value="${esc(c.rfc)}" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"></div>
      <div class="field"><label for="cCp">Código postal fiscal</label><input id="cCp" name="cp" maxlength="5" inputmode="numeric" value="${esc(c.cp||"")}"></div></div>
    <div class="field"><label for="cReg">Régimen fiscal</label><select id="cReg" name="regimen">${Object.entries(REG).map(([k,x])=>`<option value="${k}"${k===c.regimen?" selected":""}>${k} · ${x.l}</option>`).join("")}</select></div>

const lineFmt=(l,v)=>("  "+l).padEnd(42,".")+" "+(typeof v==="number"?(v<0?"-"+money(-v):money(v)):v);
function resumenTxt(c,r){
  const L=[];
  L.push("SOL-EMP · SOLUCIONES EMPRESARIALES","RESUMEN DE IMPUESTOS","","Cliente: "+c.nombre,"RFC: "+c.rfc,"Régimen: "+REG[c.regimen].l+" ("+c.regimen+")","Periodo: "+MESES[S.m-1]+" "+YEAR,"Fecha límite: "+vence(S.m),"");
  if(c.regimen!=="605"){L.push("IVA");ivaRows(r).forEach(([l,v])=>L.push(lineFmt(l,v)));L.push("")}
  L.push(r.isr.titulo.toUpperCase());r.isr.rows.forEach(([l,v])=>L.push(lineFmt(l,v)));L.push("");
  if(r.retEnt>0.5){L.push("RETENCIONES A ENTERAR",lineFmt("Total",r.retEnt),"")}
  L.push("TOTAL A PAGAR: "+money(r.total));
  if(r.notes.length){L.push("");r.notes.forEach(([,t])=>L.push("* "+t))}
  L.push("","Comprobantes del mes: "+r.E.n+" emitidos, "+r.Rt.n+" recibidos"+(r.N.n?", "+r.N.n+" de nómina":"")+".","Tarifas "+YEAR+" (Anexo 8 RMF, art. 113-E LISR). Revisar contra el portal del SAT.");
  return L.join("\n");
}
function anualTxt(c){

function csvFacturas(c,r){

  const rows=r.fs.filter(f=>f.fecha.slice(0,7)===r.ym||(f.pagos||[]).some(p=>p.fecha.slice(0,7)===r.ym)).sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .map(f=>[f.dir,f.fecha,f.uuid,f.folio,f.rfc,f.nombre,f.tipo,f.metodo,f.subtotal.toFixed(2),(f.descuento||0).toFixed(2),f.iva.toFixed(2),f.ivaRet.toFixed(2),f.isrRet.toFixed(2),f.total.toFixed(2),pagado(f).toFixed(2),f.dir==="recibida"?(f.deducible===false?"No":"Sí"):""]);
  return"﻿"+[H,...rows].map(r=>r.map(q).join(",")).join("\r\n");
}

async function descargar(filename,data){
  if(DL){try{await DL.save({filename,data})}catch(e){toast("No se descargó el archivo")}return}
  try{
    const type=filename.endsWith(".csv")?"text/csv":filename.endsWith(".json")?"application/json":"text/html";
    const url=URL.createObjectURL(new Blob([data],{type:type+";charset=utf-8"}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){toast("No se pudo descargar el archivo")}
}

      subtotal:t.sub,descuento:0,iva:t.iva,ivaRet:t.retIva,isrRet:t.retIsr,total:t.total,metodo:x.metodo==="PPD"?"PPD":"PUE",tc:1,pagos:[],deducible:true,origen:"documento",docId:x.id};
    x.registrado=true;
    try{await putFactura(f);await putDoc(x);toast("Registrado en "+MESES[+x.fecha.slice(5,7)-1].toLowerCase())}catch(e){toast(dbErr(e),5000)}
    verDoc(d.id);
  },
  convertir(d){const x=clone(S.docs[d.id]);x.id=null;x.tipo="factura";x.folio=null;x.registrado=false;x.retAuto=false;S.doc=x;docForm()},
  async borrarDoc(d){
    if(S.confirm!==d.id){S.confirm=d.id;verDoc(d.id);return}
    $("#sheet").hidden=true;S.confirm=null;
    try{const f=S.facturas[S.docs[d.id].cid+"_D"+d.id];if(f)await delFactura(f.id);await delDoc(d.id);toast("Documento borrado")}catch(e){toast(dbErr(e),5000)}render();
  }
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(t){e.preventDefault();act[t.dataset.act]&&act[t.dataset.act](t.dataset,e);return}
  if(e.target.id==="sheet")closeSheet();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
document.addEventListener("input",e=>{
  const t=e.target;if(!S.doc)return;
  if(t.dataset.d){setPath(S.doc,t.dataset.d,t.value);if(t.dataset.d==="retIsr"||t.dataset.d==="retIva")S.doc.retAuto=false}
  else if(t.dataset.ci!==undefined)S.doc.conceptos[+t.dataset.ci][t.dataset.cf]=t.value;
  else return;
  const el=$("#docTot");if(el)el.innerHTML=totHTML(docTot(S.doc),S.doc);
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.change==="mes"){S.m=+t.value;render();return}
  if(t.id==="cReg"){document.querySelectorAll("[data-reg]").forEach(x=>x.hidden=x.dataset.reg!==t.value);return}
  if(t.id==="dRfc"&&S.doc){
    S.doc.rec.rfc=t.value.trim().toUpperCase();
    if(S.doc.retAuto){Object.assign(S.doc,sugerirRet(S.clientes[S.doc.cid],S.doc.rec.rfc));$("#dRi").value=S.doc.retIsr;$("#dRv").value=S.doc.retIva;$("#docTot").innerHTML=totHTML(docTot(S.doc),S.doc)}
    return;
  }
  if(t.dataset.change==="deducible"){
    const f=clone(S.facturas[t.dataset.id]);f.deducible=t.checked;
    try{await putFactura(f)}catch(er){toast(dbErr(er),5000)}render();return;
  }
  if(t.dataset.change==="dedPers"){
    const c=clone(S.clientes[S.cid]);c.dedPers=num(t.value);
    try{await putCliente(c)}catch(er){toast(dbErr(er),5000)}render();return;
  }
  if(t.id==="restIn"&&t.files.length){aplicarRespaldo(await t.files[0].text());return}
  if(t.id==="fileIn"&&t.files.length){$("#sheet").hidden=true;await importar([...t.files],S.cid)}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const fm=e.target,d=Object.fromEntries(new FormData(fm));
  if(fm.id==="fContacto"){
    const txt="Hola, Sol-Emp. Soy "+d.nombre.trim()+(d.tel?" ("+d.tel.trim()+")":"")+".\nMe interesa: "+d.servicio+"."+(d.mensaje.trim()?"\n\n"+d.mensaje.trim():"");
    const href="mailto:"+FIRMA.correo+"?subject="+encodeURIComponent("Solicitud de asesoría: "+d.servicio)+"&body="+encodeURIComponent(txt);
    S.msgContacto=txt;
    openSheet("Tu mensaje está listo",`<pre class="report">${esc(txt)}</pre>
      <a class="btn primary full" href="${esc(href)}">Enviar por correo</a>
      <button class="btn full" data-act="copiarContacto">Copiar mensaje</button>
      <p class="small muted" style="margin:0">También puedes llamar al ${FIRMA.telTxt} o escribir a ${FIRMA.correo}.</p>`);
    return;
  }
  if(fm.id==="fCliente"){
    const rfc=d.rfc.trim().toUpperCase().replace(/\s/g,"");
    if(!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(rfc)){toast("Revisa el RFC: 12 o 13 caracteres, como ABC010101AB1");return}
    if(d.regimen==="601"&&rfc.length!==12){toast("Una persona moral tiene RFC de 12 caracteres");return}
    const prev=d.id?S.clientes[d.id]:null;
    const c=Object.assign({},prev||{},{id:d.id||uid("c"),nombre:d.nombre.trim(),rfc,cp:(d.cp||"").trim(),regimen:d.regimen,deduccion:d.deduccion||"ciega",
      coef:num(d.coef),platTasa:d.platTasa||"2.5",definitivo:!!d.definitivo});
    $("#sheet").hidden=true;S.confirm=null;
    try{await putCliente(c);toast(prev?"Cliente actualizado":"Cliente agregado")}catch(er){toast(dbErr(er),5000)}
    if(!prev){S.view="cliente";S.cid=c.id;S.tab="calculo";S.filtro=c.regimen==="605"?"nomina":"emitidas"}
    render();return;
  }
  if(fm.id==="fManual"){
    const sub=num(d.subtotal),isrRet=num(d.isrRet);let f;
    if(d.dir==="nomina"){
      const ex=num(d.exento);
      f={id:S.cid+"_M"+uid(""),cid:S.cid,uuid:"",dir:"nomina",tipo:"N",fecha:d.fecha,folio:"",rfc:"",nombre:d.nombre.trim(),subtotal:sub+ex,descuento:0,iva:0,ivaRet:0,isrRet,
        total:sub+ex-isrRet,metodo:"PUE",tc:1,pagos:[],gravado:sub,exento:ex,subsidio:0,origen:"manual"};
    }else{
      const iva=d.iva===""?Math.round(sub*16)/100:num(d.iva),ivaRet=num(d.ivaRet);
      f={id:S.cid+"_M"+uid(""),cid:S.cid,uuid:"",dir:d.dir,tipo:"I",fecha:d.fecha,folio:"",rfc:"",nombre:d.nombre.trim(),
        subtotal:sub,descuento:0,iva,ivaRet,isrRet,total:sub+iva-ivaRet-isrRet,metodo:"PUE",tc:1,pagos:[],deducible:d.dir==="recibida"?!!d.deducible:true,origen:"manual"};
    }
    $("#sheet").hidden=true;
    try{await putFactura(f);toast("Agregado")}catch(er){toast(dbErr(er),5000)}
    S.m=+d.fecha.slice(5,7);render();return;
  }
  if(fm.id==="fDoc"){
    const x=S.doc;
    if(!x.rec.nombre.trim()){toast("Falta el nombre del cliente");return}
    if(!x.conceptos.some(k=>num(k.precio)>0&&num(k.cant)>0)){toast("Agrega al menos un concepto con precio");return}
    if(x.tipo==="factura"){
      const rfc=(x.rec.rfc||"").toUpperCase();
      if(!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(rfc)){toast("Para factura, revisa el RFC del cliente");return}
      if(!/^\d{5}$/.test(x.rec.cp||"")){toast("Para factura, falta el código postal del cliente (5 dígitos)");return}
    }
    x.rec.rfc=(x.rec.rfc||"").toUpperCase();
    x.conceptos=x.conceptos.filter(k=>k.desc.trim()||num(k.precio));
    if(!x.id){x.id=uid("d");x.folio=siguienteFolio(x.cid,x.tipo)}
    else{const old=S.docs[x.id];if(old&&old.tipo!==x.tipo)x.folio=siguienteFolio(x.cid,x.tipo)}
    delete x.retAuto;
    try{
      await putDoc(x);
      const f=S.facturas[x.cid+"_D"+x.id];
      if(f&&x.registrado){const t=docTot(x),nf=clone(f);Object.assign(nf,{fecha:x.fecha,rfc:x.rec.rfc,nombre:x.rec.nombre,subtotal:t.sub,iva:t.iva,ivaRet:t.retIva,isrRet:t.retIsr,total:t.total,metodo:x.metodo});await putFactura(nf)}
      toast("Guardado");
    }catch(er){toast(dbErr(er),5000);return}
    const id=x.id;S.doc=null;S.tab="facturar";render();verDoc(id);
  }
});

document.getElementById("spSw").src=LG_SW;document.getElementById("spDk").src=LG_DARK;document.getElementById("spEm").src=LG_EMP;
{const sh=document.getElementById("spSh");sh.style.webkitMaskImage=sh.style.maskImage="url("+LOGO+")";}
render();
initStore();
if(STANDALONE&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
setTimeout(()=>{const sp=document.getElementById("splash");if(sp)sp.remove()},3500);
setTimeout(()=>$("#app").classList.remove("intro"),4300);
</script>
</body>
</html>
