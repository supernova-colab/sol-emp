<style>
/* Layout: una sola columna amplia, tarjetas con aire; resumen arriba, detalle abajo. */
:root{
  --lava1:rgba(122,160,240,.30);--lava2:rgba(150,200,250,.32);--lava3:rgba(170,150,240,.20);--glass:rgba(255,255,255,.82);
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#15192A; --muted:#5B6378; --line:#E0E4EE;
  --accent:#3F5A9E; --accent-soft:#E5EAF6; --on-accent:#FFFFFF;
  --pay:#A9412C; --pay-soft:#F6E5E0; --favor:#2A7550; --favor-soft:#E0F0E6; --warn:#8C6200; --warn-soft:#F8EED3;
  --font-d:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-b:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --lava1:rgba(60,90,170,.30);--lava2:rgba(40,110,170,.22);--lava3:rgba(90,70,170,.20);--glass:rgba(24,28,40,.84);
    --bg:#10131C; --surface:#181C28; --ink:#E7EAF2; --muted:#9AA2B6; --line:#2A3042;
    --accent:#9DB2E8; --accent-soft:#232C45; --on-accent:#10162A;
    --pay:#EE8B74; --pay-soft:#3A231E; --favor:#7BCFA0; --favor-soft:#1A3124; --warn:#E3B650; --warn-soft:#352C16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --lava1:rgba(60,90,170,.30);--lava2:rgba(40,110,170,.22);--lava3:rgba(90,70,170,.20);--glass:rgba(24,28,40,.84);
  --bg:#10131C; --surface:#181C28; --ink:#E7EAF2; --muted:#9AA2B6; --line:#2A3042;
  --accent:#9DB2E8; --accent-soft:#232C45; --on-accent:#10162A;
  --pay:#EE8B74; --pay-soft:#3A231E; --favor:#7BCFA0; --favor-soft:#1A3124; --warn:#E3B650; --warn-soft:#352C16;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:transparent}
html,body{margin:0;color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
html{touch-action:manipulation}
input,select,textarea{font-size:16px!important} /* evita el zoom automático del iPhone al tocar un campo */
.narrow{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.mid{width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.num,td.v,.big{font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:22px 18px 96px;display:flex;flex-direction:column;gap:26px}
.top{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ttl{font-size:1.5rem;font-weight:800}
.ttl small{display:block;font-family:var(--font-b);font-weight:400;color:var(--muted);font-size:.88rem;letter-spacing:0;margin-top:2px}
.logo{width:118px;height:auto;background:#fff;border-radius:12px;padding:6px 8px;border:1px solid var(--line);flex:none}
.brand small{display:block;font-family:var(--font-b);font-weight:400;color:var(--muted);font-size:.85rem;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.pay{background:var(--pay-soft);color:var(--pay)}
.chip.favor{background:var(--favor-soft);color:var(--favor)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mute{background:var(--line);color:var(--muted)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.period label{font-size:.85rem;color:var(--muted)}
.period select{flex:1;border:0;background:transparent;font-family:var(--font-d);font-weight:700;font-size:1.05rem;padding:4px 0;min-height:36px}
.period .due{flex-basis:100%;font-size:.82rem;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--font-d);font-size:1.35rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:1.1rem}
.list{display:flex;flex-direction:column;gap:12px}
.client{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer}
.client:hover,.inv:hover{border-color:var(--accent)}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;flex:none}
.client .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.client .info strong{overflow-wrap:anywhere}
.client .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.client .amt b{font-variant-numeric:tabular-nums;font-family:var(--font-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--pay);border-color:var(--pay-soft)}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .primary{grid-column:1 / -1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:flex;flex-direction:column;gap:18px}
.hero .label{font-size:.88rem;color:var(--muted)}
.big{font-family:var(--font-d);font-weight:800;font-size:2.4rem;line-height:1.1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.split div{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split span{font-size:.78rem;color:var(--muted)}
.split b{font-variant-numeric:tabular-nums;font-size:.98rem;overflow-wrap:anywhere}
.notes{display:flex;flex-direction:column;gap:8px}
.note{font-size:.88rem;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin:0}
.note.info{background:var(--accent-soft);color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;padding:4px 2px}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
table.calc{width:100%;border-collapse:collapse}
table.calc td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.calc td.v{text-align:right;white-space:nowrap;padding-left:14px}
table.calc tr.total td{border-bottom:0;font-weight:700;font-family:var(--font-d);padding-top:14px;font-size:1.05rem}
table.calc tr.sub td{color:var(--muted);font-size:.9rem}
.scroll{overflow-x:auto}
table.months{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums;min-width:420px}
table.months th{font-weight:500;color:var(--muted);text-align:right;padding:8px 0 8px 10px;border-bottom:1px solid var(--line)}
table.months th:first-child,table.months td:first-child{text-align:left;padding-left:0}
table.months td{text-align:right;padding:8px 0 8px 10px;border-bottom:1px solid var(--line)}
table.months tr.t td{font-weight:700;border-bottom:0}
.card h3{font-size:1rem;margin-bottom:6px}
.inv{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.inv .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.inv .info strong{font-weight:600;overflow-wrap:anywhere}
.inv .tags{display:flex;flex-wrap:wrap;gap:6px}
.inv .amt{text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.empty{text-align:center;padding:34px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{margin:0;max-width:44ch}
.overlay{position:fixed;inset:0;background:rgba(12,15,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;max-height:92dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{font-size:1.15rem}
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:1px solid var(--line);border-radius:14px;padding:16px;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
legend{font-family:var(--font-d);font-weight:700;padding:0 6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.85rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:38px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.con{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.con .field input,.con .field select{background:var(--surface)}
.tot{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-variant-numeric:tabular-nums;font-size:.95rem}
.tot dt{color:var(--muted)} .tot dd{margin:0;text-align:right}
.tot .gt{font-family:var(--font-d);font-weight:800;font-size:1.15rem;color:var(--ink)}
pre.report{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:16px;font-size:.82rem;line-height:1.55;margin:0;font-family:ui-monospace,"SF Mono",Menlo,monospace;overflow-x:auto}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
/* Documento (factura / recibo) */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;font-size:.88rem}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.doc .dt{font-family:var(--font-d);font-weight:800;font-size:1.05rem;color:var(--accent);text-align:right}
.doc .blk{display:flex;flex-direction:column;gap:2px}
.doc .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th{font-weight:500;color:var(--muted);text-align:left;font-size:.75rem;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.doc td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.doc .r{text-align:right}
.doc .letra{font-size:.8rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.foot{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.6}
@media (max-width:420px){.big{font-size:2rem}.split{gap:8px}.split div{padding:10px}.split b{font-size:.88rem}.three{grid-template-columns:1fr 1fr}.tabs button{font-size:.82rem}}

/* ===== Apartados: navegación inferior, inicio, servicios, contacto ===== */
.wrap{padding-bottom:140px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.mono{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;margin-top:4px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mono img{width:175px;height:auto;flex:none;filter:drop-shadow(0 8px 14px rgba(21,25,42,.12))}
.mono-t{background:var(--accent-soft);color:var(--accent);font-size:.9rem;padding:8px 16px;border-radius:999px}
.mono .bub{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(21,25,42,.06)}
.mono .bub b{display:block;font-size:.98rem}
.mono .bub span{font-size:.84rem;color:var(--muted)}
.mono .bub::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.fab-op{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:inherit;text-decoration:none;font:inherit;text-align:left;cursor:pointer}
.fab-op .ib{flex:none}
.fab-op b{display:block;font-size:1rem}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq details:last-child{border-bottom:0}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-weight:700}
.faq details[open] summary::after{content:"−"}
.faq p{margin:10px 0 0;color:var(--muted);font-size:.92rem;line-height:1.5}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--muted);padding:7px 0 6px;border-radius:14px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top-mini{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-mini .logo{width:104px}
.hero-sol{position:relative;overflow:hidden;border-radius:24px;padding:30px 24px 28px;color:#fff;background:linear-gradient(155deg,#4C68B0 0%,#2D4079 100%);display:flex;flex-direction:column;gap:20px}
.hero-sol::before{content:"";position:absolute;right:-90px;top:-70px;width:280px;height:280px;border-radius:50%;border:38px solid rgba(255,255,255,.07)}
.hero-sol::after{content:"";position:absolute;left:-60px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero-sol>*{position:relative}
.hero-sol .eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;opacity:.8}
.hero-sol h1{font-size:2rem;line-height:1.12;font-weight:800;color:#fff}
.hero-sol p{margin:0;opacity:.88;max-width:40ch}
.hero-sol .areas{display:flex;flex-wrap:wrap;gap:8px}
.hero-sol .areas span{font-size:.78rem;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.hero-sol .cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-sol .cta .btn{white-space:nowrap;padding:10px 12px}
.btn.on-blue{background:#fff;color:#2D4079;border-color:#fff}
.btn.on-blue-o{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.sec-t{display:flex;flex-direction:column;gap:4px}
.sec-t .eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sec-t h2{font-size:1.35rem}
.sec-t p{margin:0;color:var(--muted)}
.svc-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.svc-grid{grid-template-columns:1fr 1fr}}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;width:100%}
.svc:hover{border-color:var(--accent)}
.svc .ib{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.svc h3{font-size:1.02rem;margin:0}
.svc p{margin:0;color:var(--muted);font-size:.92rem}
.svc .more{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:.88rem;margin-top:auto}
.svc .more .ic{width:16px;height:16px}
.mvv{display:grid;gap:14px}
.mvv .card{display:flex;flex-direction:column;gap:8px}
.mvv .card h3{display:flex;align-items:center;gap:10px;margin:0}
.mvv .card p{margin:0;color:var(--muted)}
.dates{display:flex;flex-direction:column;gap:2px}
.date-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.date-row:last-child{border-bottom:0}
.dbadge{width:54px;flex:none;border-radius:14px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:8px 0;display:flex;flex-direction:column;line-height:1.1}
.dbadge b{font-family:var(--font-d);font-size:1.3rem}
.dbadge span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.date-row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct-list{display:flex;flex-direction:column}
.ct{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.ct:last-child{border-bottom:0}

/* ===== Sistema de despacho ===== */
table.act{min-width:1180px}
table.act td{padding:8px 8px}
table.act .ycell{width:108px}
table.act .ycell.coef{width:86px}
table.act td.na{background:#B9BEC9}
table.act th.pa{text-align:center!important;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;border-bottom:1px solid var(--line)}
table.act .emp{position:sticky;left:0;background:var(--surface);min-width:150px;white-space:normal;z-index:1;border-right:1px solid var(--line)}
table.act th.emp{background:var(--bg)}
#mesesPF{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px}
.actions .full2{grid-column:1 / -1}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer}
.opt b{font-weight:600}.opt span{font-size:.78rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] b{color:var(--accent)}
ol.howto{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:p}
ol.howto li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:2px 12px}
ol.howto li::before{content:counter(p);grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-d);font-weight:800}
ol.howto span{font-size:.9rem;color:var(--muted)}
.tiles{grid-template-columns:1fr 1fr}
.top-mini{flex-wrap:wrap}
html,body{overflow-x:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.period{flex-wrap:wrap}
.period .btn.sm{min-height:36px;padding:4px 12px;font-size:1.1rem}
.apart{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.apart button{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.apart button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.apart b{font-family:var(--font-d);font-size:1.05rem;color:var(--ink)}
.apart span{font-size:.8rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{display:flex;flex-direction:column;gap:7px;font-size:.72rem;color:var(--muted);text-align:center;line-height:1.25}
.step i{height:5px;border-radius:5px;background:var(--line)}
.step.done i,.step.cur i{background:var(--accent)}
.step.cur{color:var(--accent);font-weight:600}
.banner{border-radius:16px;padding:16px 18px}
.banner.ok{background:var(--favor-soft);color:var(--favor)}
.banner.lock{background:var(--line);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.checks{display:flex;flex-direction:column;gap:10px}
.checkcard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.checkcard input{margin-top:3px;width:20px;height:20px;accent-color:var(--accent);flex:none}
.checkcard:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.adm{min-width:900px}
table.adm td{vertical-align:middle}
table.adm tr.inact td:not(:nth-child(3)){opacity:.55}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;cursor:pointer;font:inherit;font-size:.84rem;white-space:nowrap}
.sw i{position:relative;width:38px;height:22px;border-radius:999px;background:#C9CED8;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--favor)}
.sw[aria-checked="true"] i::after{transform:translateX(16px)}
.tipo-op{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;text-align:left;color:inherit}
.tipo-op b{display:block}
table.cat{min-width:760px}
.nota{display:block;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:.8rem;white-space:normal}
.ab{display:inline-block;font-weight:700;font-size:.78rem;letter-spacing:.02em;white-space:nowrap}
.okchk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.84rem}
.okchk input{width:18px;height:18px}
table.xl{border-collapse:separate;border-spacing:0;min-width:720px;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
table.xl th{background:var(--bg);color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.xl th.grp{text-align:center;color:var(--accent);border-bottom:1px solid var(--line)}
table.xl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.xl td.wrapc{white-space:normal;min-width:180px;max-width:260px}
table.xl .n{text-align:right}
table.xl .rn{color:var(--muted);background:var(--bg);text-align:center;width:38px;font-size:.74rem;position:sticky;left:0}
table.xl tr.xr{cursor:pointer}
table.xl tr.xr:hover td,table.xl tr.sel td{background:var(--accent-soft)}
table.xl tr.trt td{font-weight:700;background:var(--bg);border-bottom:0}
.est{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;font-size:.72rem;font-weight:700}
.est-C{background:var(--favor-soft);color:var(--favor)}.est-I{background:var(--pay-soft);color:var(--pay)}.est-MA{background:var(--accent-soft);color:var(--accent)}
.who{font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--muted)}
.ycap{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.78rem;color:var(--muted)}
.ycell{width:120px;text-align:right;border:1px solid #E6C64C;background:#FFF6CC;color:#4A3B00;border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.ytag{background:#FFF6CC;color:#4A3B00;border-radius:6px;padding:2px 6px}
.pc-box{background:#14182A;color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.pc-head{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.12)}
.pc-head .pc-emp{font-family:var(--font-d);font-size:1.15rem;color:#fff;overflow-wrap:anywhere}
.pc-head span{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#AEB7D6}
.pc-io{display:flex;flex-direction:column;gap:8px}
.pc-io div{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.pc-io span{font-size:.88rem;color:#C9D0E8}
.pc-io b{font-family:var(--font-d);font-size:1.05rem;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-imp{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.04);border-radius:12px;padding:12px 14px}
.pc-lbl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:#AEB7D6;padding-bottom:6px}
.pc-l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.pc-l span{font-size:.92rem;color:#E4E8F5}
.pc-l b{font-family:var(--font-d);font-size:1.02rem;color:#FF8A80;font-variant-numeric:tabular-nums}
.pc-l.pc-tot{border-bottom:0;padding-top:12px}
.pc-l.pc-tot span{font-weight:700;color:#fff}
.pc-l.pc-tot b{font-size:1.5rem}
.pc-favor{font-size:.85rem;color:#9FE3B8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Entrada: el logo se arma por partes (trazos, texto, EMP), brillo, y la cortina sube */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:radial-gradient(120% 70% at 50% 45%,#FFFFFF 0%,#F4F6FC 60%,#E9EEF9 100%);
  animation:spOut .85s cubic-bezier(.76,0,.24,1) 2.55s forwards}
#splash::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:linear-gradient(90deg,#3F5A9E,#7C95D3,#3F5A9E)}
#splash .sp{position:relative;width:min(330px,78vw);display:flex;flex-direction:column;align-items:center;gap:30px}
#splash .lg{position:relative;width:100%;aspect-ratio:600/394;animation:spSettle 2.4s cubic-bezier(.2,.8,.2,1) both}
#splash .lg img,#splash .shine{position:absolute;inset:0;width:100%;height:100%}
#splash .sw{-webkit-mask-image:linear-gradient(58deg,#000 42%,transparent 58%);mask-image:linear-gradient(58deg,#000 42%,transparent 58%);
  -webkit-mask-size:260% 260%;mask-size:260% 260%;-webkit-mask-position:100% 100%;mask-position:100% 100%;animation:spWipe 1s cubic-bezier(.65,0,.25,1) .2s forwards}
#splash .dk{opacity:0;transform:translateY(14px);filter:blur(8px);animation:spRise .75s cubic-bezier(.2,.8,.2,1) .8s forwards}
#splash .em{opacity:0;transform:translateX(26px);animation:spSlide .7s cubic-bezier(.2,.8,.2,1) 1.15s forwards}
#splash .shine{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:130% 0;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;animation:spShine .9s ease-in-out 1.7s forwards}
#splash .tag{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-family:var(--font-b);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:#5B6378;opacity:0;animation:spTag .7s ease 1.55s forwards}
@keyframes spWipe{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes spRise{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes spSlide{to{opacity:1;transform:none}}
@keyframes spShine{to{background-position:-30% 0}}
@keyframes spSettle{0%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes spTag{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:.32em}}
@keyframes spOut{to{transform:translateY(-100%)}}
#app.intro>*{animation:upIn .75s cubic-bezier(.2,.8,.2,1) backwards}
#app.intro>*:nth-child(1){animation-delay:2.95s}#app.intro>*:nth-child(2){animation-delay:3.03s}#app.intro>*:nth-child(3){animation-delay:3.11s}
#app.intro>*:nth-child(4){animation-delay:3.19s}#app.intro>*:nth-child(5){animation-delay:3.27s}#app.intro>*:nth-child(n+6){animation-delay:3.35s}
@keyframes upIn{from{opacity:0;transform:translateY(22px)}}
@media (prefers-reduced-motion:reduce){#splash{display:none}#app.intro>*{animation:none}}

.tile-btn b{font-family:var(--font-d);font-size:1.02rem;line-height:1.25}

.pill.ok{background:var(--favor-soft);color:var(--favor)}

.banner.danger{background:var(--pay-soft);color:var(--pay)}

.lim{display:flex;flex-direction:column;gap:10px}

.emp-card[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}

.grp-b{border-top:1px solid var(--line);padding-top:12px}
.inv-w{display:flex;flex-direction:column;gap:8px}
.btn.cobrar{align-self:flex-end;background:var(--favor-soft);color:var(--favor);border-color:transparent}

/* Vista de PDF */
#printArea{position:fixed;inset:0;z-index:60;background:#E9ECF2;overflow:auto;-webkit-overflow-scrolling:touch}
#printArea[hidden]{display:none!important}
.pbar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;padding:12px;background:rgba(233,236,242,.95);backdrop-filter:blur(6px);z-index:2}

.pp .box td{border:1px solid #D5DAE5;padding:5px 10px}

body.printing{overflow:hidden}
@media print{

.eh-t{min-width:0;display:flex;flex-direction:column;gap:2px}.eh-t h2{font-size:1.35rem;overflow-wrap:anywhere}.eh-t span{font-size:.86rem;color:var(--muted)}
.mes-row{display:flex;gap:10px;align-items:stretch}.mes-row .period{flex:1;min-width:0}
.period select{min-width:0;width:0;text-overflow:ellipsis}
.mes-row .period{flex-wrap:nowrap;gap:4px;padding:10px 10px}
.icon-r{flex:none;width:56px;border-radius:16px;font-size:1.3rem;padding:0;background:var(--glass)}
.estado-card{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--glass);box-shadow:0 1px 2px rgba(20,30,60,.04),0 8px 28px rgba(30,50,110,.07)}
.ec-ic{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}.ec-ic .ic{width:20px;height:20px}
.estado-card.warn .ec-ic{background:var(--warn-soft);color:var(--warn)}.estado-card.ok .ec-ic{background:var(--favor-soft);color:var(--favor)}.estado-card.lock .ec-ic{background:var(--pay-soft);color:var(--pay)}
.estado-card strong{font-size:1.02rem}
.ec-nota{margin-top:6px;font-size:.78rem;color:var(--pay);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qk{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;border:0;cursor:pointer;text-align:left;color:#fff;box-shadow:0 10px 24px rgba(30,50,110,.18);transition:transform .12s,box-shadow .15s}
.qk:active{transform:scale(.98)}@media (hover:hover){.qk:hover{box-shadow:0 14px 30px rgba(30,50,110,.26)}}
.qk.ing{background:linear-gradient(135deg,#2E7D5B,#3FA176)}.qk.gas{background:linear-gradient(135deg,#3F5A9E,#5B7BC7)}
.qk-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);font-size:1.5rem;font-weight:700;line-height:1}
.qk b{display:block;font-size:1rem}.qk small{display:block;font-size:.76rem;opacity:.85;margin-top:2px}
@media (max-width:380px){.qk{flex-direction:column;align-items:flex-start;gap:8px}}
.dl-t{display:flex!important;flex-direction:row!important;align-items:center;gap:14px;text-align:left}
.dl-t>span:last-child{display:flex;flex-direction:column;gap:2px}.dl-t b{color:var(--ink)}
.dl-ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px}.dl-ic .ic{width:22px;height:22px}
@media (max-width:420px){.dl-t{flex-direction:column!important;align-items:flex-start}}
.dl-ic.xl{background:#E1F2E8;color:#1F7A4C}.dl-ic.pdf{background:#FBE4E0;color:#B23A2A}
.btn-save{min-height:56px;font-size:1.05rem;gap:10px;margin-top:6px}
.btn-save .ic{width:22px;height:22px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:12px 22px 12px 16px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;box-shadow:0 6px 18px rgba(40,60,120,.28);animation:backPulse 1.6s ease-out 2;transition:transform .12s,filter .15s}
.back:hover{filter:brightness(1.08)}.back:active{transform:scale(.97)}
.back .ic{width:20px;height:20px}
@keyframes backPulse{0%{box-shadow:0 0 0 0 rgba(63,90,160,.55),0 6px 18px rgba(40,60,120,.28)}70%{box-shadow:0 0 0 14px rgba(63,90,160,0),0 6px 18px rgba(40,60,120,.28)}100%{box-shadow:0 0 0 0 rgba(63,90,160,0),0 6px 18px rgba(40,60,120,.28)}}
.back-float{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,calc(50% - 650px + 16px));z-index:40;opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .2s,transform .2s;animation:none}
body.scrolled .back-float{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.back{animation:none}}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.84rem;font-weight:600;line-height:1.2;text-align:center;cursor:pointer;transition:border-color .15s,transform .1s}
.qa button:active{transform:scale(.97)}
.qa button:hover{border-color:var(--accent)}
.qa i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.qa .ic{width:22px;height:22px}
.otras{display:flex;flex-direction:column;gap:8px}
.otras-l{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.otras-l::-webkit-scrollbar{display:none}
.otras-l button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;max-width:240px}
.otras-l b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.otras-l span{font-size:.76rem;color:var(--muted)}
.emp-lay{display:flex;flex-direction:column;gap:26px}
.emp-side,.emp-main{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:700px) and (max-width:899px){.wrap{max-width:820px}}
@media (min-width:1000px){
  .wrap.wide{max-width:1300px}
  .emp-lay{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;align-items:start}
  .emp-side .rt{grid-template-columns:1fr 1fr}
}
.grupo{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grupo>summary{list-style:none;display:flex;align-items:flex-start;gap:12px;padding:16px;cursor:pointer}
.grupo>summary::-webkit-details-marker{display:none}
.g-txt{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.g-txt>b{font-family:var(--font-d);font-size:1.12rem;overflow-wrap:anywhere}
.g-txt>span:not(.g-row){font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.g-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.g-chev{color:var(--muted);transition:transform .2s;margin-top:4px}
.grupo[open] .g-chev{transform:rotate(90deg)}
.g-body{display:flex;flex-direction:column;gap:10px;padding:0 12px 14px;border-top:1px solid var(--line);padding-top:12px;background:var(--bg)}
.tools{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tool{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.tool:last-child{border-bottom:0}
.tool>span:first-child{display:flex;flex-direction:column;gap:2px}
.tool b{font-weight:700}.tool span span{font-size:.82rem;color:var(--muted)}
.tool:disabled{opacity:.45}
@media (min-width:900px){.clist{display:grid;grid-template-columns:1fr 1fr}}
.tabs.many{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs.many::-webkit-scrollbar{display:none}
.tabs.many button{flex:0 0 auto;padding:4px 16px}
table.actm th.cur{background:var(--accent-soft);color:var(--accent)}
table.actm td.emp{min-width:230px;font-size:.8rem}
table.actm tr.ivar input.ycell{background:#F6C445}
</style>

// Tarifa del art. 96 con k meses; redondea marginal y cuota fija a pesos, como el Excel
function tarifa(base,k){
  if(base<=0)return{li:0,exc:0,pct:0,marg:0,cuota:0,isr:0};
  let r=CFG.tarifaPF[0];for(const t of CFG.tarifaPF)if(base>=t[0]*k)r=t;
  const li=r[0]*k,exc=base-li,marg=Math.round(exc*r[2]/100),cuota=Math.round(r[1]*k);
  return{li,exc,pct:r[2],marg,cuota,isr:marg+cuota};
}

function cargarScript(src){return new Promise((ok,no)=>{const t=document.createElement("script");t.src=src;t.onload=ok;t.onerror=no;document.head.appendChild(t)})}
async function getSb(){
  if(sb)return sb;
  if(!sbCargando)sbCargando=(async()=>{
    const tag=document.querySelector('script[src*="supabase"]');
    if(!window.supabase&&tag)await new Promise(r=>{tag.addEventListener("load",r,{once:true});tag.addEventListener("error",r,{once:true});setTimeout(r,9000)});
    if(!window.supabase){
      for(const u of["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js","https://unpkg.com/@supabase/supabase-js@2.100.1/dist/umd/supabase.js"]){
        try{await cargarScript(u);if(window.supabase)break}catch(e){}
      }
    }
    if(!window.supabase||!window.supabase.createClient)throw new Error("No se pudo cargar la conexión. Revisa tu internet y vuelve a abrir la app.");
    sb=window.supabase.createClient(SB_URL,SB_KEY);
    sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){S.sec="trabajo";render();openSheet("Nueva contraseña",`<form id="fNuevaPw"><div class="field"><label for="npw">Escribe tu nueva contraseña</label><input id="npw" name="pw" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn primary full" type="submit">Guardar</button></form>`)}});
    return sb;
  })().catch(e=>{sbCargando=null;throw e});
  return sbCargando;
}

// Si aún no se agregan las columnas nuevas en Supabase, guarda sin ellas (y avisa una vez)
async function upsertFlex(tabla,row,nuevas){
  let r=await (await getSb()).from(tabla).upsert(row).select().single();
  if(r.error&&/column|schema cache|PGRST204/i.test(r.error.message||r.error.code||"")){
    const extra={};nuevas.forEach(k=>{if(k in row){extra[k]=row[k];delete row[k]}});
    r=await (await getSb()).from(tabla).upsert(row).select().single();
    if(!r.error){if(!upsertFlex.aviso){upsertFlex.aviso=1;toast("Falta correr el SQL nuevo en Supabase: algunos datos no se guardaron.",6000)}return Object.assign(r.data,extra)}
  }
  if(r.error)throw r.error;return r.data;
}

/* ================= Cálculo (igual que los Excel de precierre del despacho) =================
   Ingresos: C = contado (facturado y cobrado), I = crédito (facturado, sin cobrar),
   MA = complemento de pago (cobro de una factura de meses anteriores).
   PM régimen general: ISR con coeficiente sobre lo facturado (C + crédito).
   PM RESICO, PF y arrendamiento: ISR sobre lo cobrado (C + MA). IVA siempre sobre lo cobrado. */
const est=x=>x.estatus||"C";
const regDe=c=>(c.regimenes||[])[0]||"601";
const esAut=c=>(c.regimenes||[]).includes("601")&&c.actividad==="Autotransporte";
// Características fiscales de la empresa (el despacho puede cambiarlas en Editar empresa)
function fiscal(c){
  const r=regDe(c),f=c.fiscal||{};
  const def=r==="601"?(esAut(c)?{iva:[true,CFG.retAut],isr:[false,0]}:{iva:[false,0],isr:[false,0]})
    :r==="626"?{iva:[false,0],isr:[false,0]}
    :r==="626F"?{iva:[true,CFG.retIvaPF],isr:[true,CFG.retIsrResico]}
    :{iva:[true,CFG.retIvaPF],isr:[true,CFG.retIsrPF]};
  const g=(k,i)=>f[k]&&f[k][i]!=null?f[k][i]:def[k][i];
  return{aut:esAut(c),retIva:{aplica:!!g("iva",0),pct:num(g("iva",1))},retIsr:{aplica:!!g("isr",0),pct:num(g("isr",1))},
    devengado:r==="601",auto:esAut(c)};
}
const tieneRet=x=>(+x.iva_ret||0)>0||(+x.isr_ret||0)>0;
function retDe(c,sub,estatus,retSi){ // retenciones de una factura de ingreso
  const f=fiscal(c);if(estatus==="I")return{iva:0,isr:0};
  const on=f.aut||retSi;
  return{iva:on&&f.retIva.aplica?Math.round(sub*f.retIva.pct)/100:0,isr:on&&f.retIsr.aplica&&!f.aut?Math.round(sub*f.retIsr.pct)/100:0};
}
const IVA_TASAS=[["16","16 %"],["0","0 %"],["exento","Exento"],["manual","Manual"]];
const tasaDe=x=>x.tasa_iva||(num(x.subtotal)&&Math.abs(num(x.iva)-num(x.subtotal)*0.16)>0.02?(num(x.iva)?"manual":"0"):"16");
function suma(cid,reg,a,b,modo){
  const o={base:0,iva:0,ivaRet:0,isrRet:0,n:0};
  for(const x of Object.values(S.movs)){
    if(x.cliente_id!==cid||x.mes<a||x.mes>b)continue;
    if(reg&&x.regimen&&x.regimen!==reg)continue;
    if(modo==="elab"){if(x.tipo!=="ingreso"||est(x)==="MA")continue}
    else if(modo==="cobr"){if(x.tipo!=="ingreso"||est(x)==="I")continue}
    else{if(x.tipo!=="gasto")continue;if(modo==="gded"&&x.deducible===false)continue}
    o.base+=x.subtotal||0;o.iva+=x.iva||0;o.ivaRet+=x.iva_ret||0;o.isrRet+=x.isr_ret||0;o.n++;
  }
  return o;
}

function calcISR(c,reg,mes){return memo("isr|"+c.id+"|"+reg+"|"+mes,()=>{

  let rows=[],isr=0,pago=0,extra={};
  if(reg==="601"){
    const ingMes=suma(c.id,reg,mes,mes,"elab").base,otros=A("otros_ing"),ingAnt=A("ing_ant"),total=ingMes+otros+ingAnt;
    const coef=A("coef")||num(c.coef),util=total*coef,ret=retMes+retAnt,base=util-ptu-perd-ret-rend;
    isr=base*CFG.tasaPM/100;pago=Math.max(0,Math.round(isr-pagosAnt-comp));
    rows=[["Ingresos acumulables del mes",ingMes],["Más: otros ingresos adicionales",otros,"","otros_ing"],["Más: ingresos acumulables de meses anteriores",ingAnt,"","ing_ant"],["Igual: total de ingresos",total,"sum"],
      ["Por: coeficiente de utilidad",coef.toFixed(4),"sub"],["Igual: utilidad fiscal del periodo",util,"sum"],["Menos: PTU acumulada",-ptu,"","ptu"],
      ["Menos: pérdidas fiscales",-perd,"","perdidas"],["Menos: ISR retenido del mes",-retMes],["Menos: ISR retenido de meses anteriores",-retAnt,"","isr_ret_ant"],["Menos: rendimientos acumulados",-rend,"","rendimientos"],
      ["Igual: base del pago provisional",base,"sum"],["Por: tasa de ISR "+CFG.tasaPM+" %",isr],["Menos: pagos provisionales de meses anteriores",-pagosAnt,"","pagos_ant"],["Menos: compensación de ISR a favor",-comp,"","comp"],["ISR neto a pagar",pago,"total"]];
    extra={ingMes,coef};
  }else if(reg==="626"){
    const ingMes=Co.base+A("otros_ing"),ingAnt=A("ing_ant"),total=ingMes+ingAnt;
    const dedMes=Gd.base+A("otras_ded"),dedAnt=A("gas_ant"),dep=A("depreciacion"),totalDed=dedMes+dedAnt+dep;
    const base=total-totalDed-ptu-perd-rend;isr=base*CFG.tasaPM/100;
    pago=Math.max(0,isr-retMes-retAnt-pagosAnt-comp);
    rows=[["Ingresos cobrados del mes",Co.base],["Más: otros ingresos adicionales",A("otros_ing"),"","otros_ing"],["Más: ingresos acumulables de meses anteriores",ingAnt,"","ing_ant"],["Igual: total de ingresos acumulables",total,"sum"],
      ["Deducciones del mes (gastos pagados)",Gd.base],["Más: otras deducciones adicionales",A("otras_ded"),"","otras_ded"],["Más: deducciones de meses anteriores",dedAnt,"","gas_ant"],["Más: depreciación",dep,"","depreciacion"],["Igual: total de deducciones acumuladas",totalDed,"sum"],
      ["Menos: PTU acumulada",-ptu,"","ptu"],["Menos: pérdidas fiscales",-perd,"","perdidas"],["Menos: rendimientos acumulados",-rend,"","rendimientos"],["Igual: base del pago provisional",base,"sum"],
      ["ISR determinado ("+CFG.tasaPM+" %)",isr],["Menos: ISR retenido del mes",-retMes],["Menos: ISR retenido de meses anteriores",-retAnt,"","isr_ret_ant"],["Menos: pagos provisionales de meses anteriores",-pagosAnt,"","pagos_ant"],["Menos: compensación de ISR a favor",-comp,"","comp"],["ISR neto a pagar",pago,"total"]];

function calcIVA(c,mes){return memo("iva|"+c.id+"|"+mes,()=>{

  const o={tras:C.iva,ret:C.ivaRet,acred:G.iva,ant};o.neto=o.tras-o.ret-o.acred-o.ant;
  o.cargo=Math.max(0,o.neto);o.favor=Math.max(0,-o.neto);return o;
})}
function calc(c,mes){

  // Ingresos del mes para el resumen: lo que cuenta para ISR en el régimen
  const ingRes=(c.regimenes||[]).includes("601")?E.base:Co.base;

}

function parseCFDI(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("xml");
  const c=doc.documentElement;if(!c||c.localName!=="Comprobante")throw new Error("nocfdi");
  const A=(el,n)=>el?el.getAttribute(n):null;
  const kid=(el,n)=>el?[...el.children].find(e=>e.localName===n):null;
  const tfd=doc.getElementsByTagNameNS("*","TimbreFiscalDigital")[0];
  const moneda=A(c,"Moneda")||"MXN",tc=(moneda==="MXN"||moneda==="XXX")?1:(num(A(c,"TipoCambio"))||1);
  const em=kid(c,"Emisor"),re=kid(c,"Receptor"),imp=kid(c,"Impuestos");
  let iva=0,ivaRet=0,isrRet=0;
  if(imp){
    const tr=kid(imp,"Traslados");if(tr)for(const t of tr.children)if(A(t,"Impuesto")==="002")iva+=num(A(t,"Importe"));
    const rt=kid(imp,"Retenciones");if(rt)for(const r of rt.children){const v=num(A(r,"Importe"));if(A(r,"Impuesto")==="001")isrRet+=v;else if(A(r,"Impuesto")==="002")ivaRet+=v}
  }
  const o={uuid:(A(tfd,"UUID")||"").toUpperCase(),tipo:A(c,"TipoDeComprobante"),fecha:(A(c,"Fecha")||"").slice(0,10),
    folio:[A(c,"Serie"),A(c,"Folio")].filter(Boolean).join("-"),
    emRfc:(A(em,"Rfc")||"").toUpperCase(),emNom:A(em,"Nombre")||"",reRfc:(A(re,"Rfc")||"").toUpperCase(),reNom:A(re,"Nombre")||"",
    subtotal:num(A(c,"SubTotal"))*tc,descuento:num(A(c,"Descuento"))*tc,total:num(A(c,"Total"))*tc,
    iva:iva*tc,ivaRet:ivaRet*tc,isrRet:isrRet*tc,metodo:A(c,"MetodoPago")||"PUE",moneda,tc,pagos:[]};
  if(o.tipo==="P"){
    for(const p of doc.getElementsByTagNameNS("*","Pago")){
      const fp=(A(p,"FechaPago")||"").slice(0,10);
      for(const d of p.getElementsByTagNameNS("*","DoctoRelacionado"))o.pagos.push({rel:(A(d,"IdDocumento")||"").toUpperCase(),fecha:fp,imp:num(A(d,"ImpPagado"))});
    }
  }
  if(o.tipo==="N"){
    const nom=doc.getElementsByTagNameNS("*","Nomina")[0];
    if(nom){
      const per=kid(nom,"Percepciones"),ded=kid(nom,"Deducciones"),otr=kid(nom,"OtrosPagos");
      o.fecha=(A(nom,"FechaPago")||o.fecha).slice(0,10);
      o.gravado=num(A(per,"TotalGravado"));o.exento=num(A(per,"TotalExento"));
      o.isrNom=num(A(ded,"TotalImpuestosRetenidos"));
      let sub=0;if(otr)for(const op of otr.children){const s=kid(op,"SubsidioAlEmpleo");if(s)sub+=num(A(op,"Importe"))}
      o.subsidio=sub;
    }
  }
  return o;
}
async function leerArchivos(files){
  const out=[];
  for(const f of files){
    const n=f.name.toLowerCase();
    if(n.endsWith(".zip")){
      if(!window.JSZip){try{await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js")}catch(e){}}
      if(!window.JSZip){out.push({err:"zip"});continue}
      try{const z=await JSZip.loadAsync(f);for(const e of Object.values(z.files))if(!e.dir&&e.name.toLowerCase().endsWith(".xml"))out.push({text:await e.async("string")})}catch(e){out.push({err:"zip"})}
    }else out.push({text:await f.text()});
  }
  return out;
}

    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}catch(e){toast("No se pudo descargar el archivo")}
}

    const parts=[],cen=[];let off=0;
    const d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
    for(const f of files){
      const name=enc.encode(f.name),data=typeof f.data==="string"?enc.encode(f.data):f.data,c=crc(data);
      const h=new DataView(new ArrayBuffer(30));

// PDF: vista de impresión con el mismo formato; el usuario elige "Guardar como PDF"
function precierreHTML(c,m){
  return(c.regimenes||[]).map(reg=>{
    const{r,v,isr,I,G}=datosPrecierre(c,reg,m),ok=actualizado(c,m);
    const CP=colsPrecierre(reg),n=Math.max(I.length,G.length,1),ti=CP.ing.map(()=>0),tg=CP.gas.map(()=>0);let filas="";
    const cel=(c2,val,arr,k)=>{if(c2[3]==="$"){if(val!=="")arr[k]+=num(val);return`<td>${val!==""?money(val):""}</td>`}return`<td${c2[3]==="c"?' class="c"':""}>${esc(String(val))}</td>`};
    for(let i=0;i<n;i++){const a=I[i],g=G[i];
      filas+=`<tr>${CP.ing.map((c2,k)=>cel(c2,a?c2[2](a,est(a)):"",ti,k)).join("")}<td class="gap"></td>${CP.gas.map((c2,k)=>cel(c2,g?c2[2](g):"",tg,k)).join("")}</tr>`}
    const grp=list=>{let h="",i=0;while(i<list.length){const c2=list[i];if(!c2[1]){h+=`<th rowspan="2">${c2[0]}</th>`;i++;continue}let j=i;while(j+1<list.length&&list[j+1][1]===c2[1])j++;h+=`<th colspan="${j-i+1}">${c2[1]}</th>`;i=j+1}return h};
    const thead=`<tr>${grp(CP.ing)}<th class="gap" rowspan="2"></th>${grp(CP.gas)}</tr><tr>${CP.ing.filter(c2=>c2[1]).map(c2=>`<th>${c2[0]}</th>`).join("")}${CP.gas.filter(c2=>c2[1]).map(c2=>`<th>${c2[0]}</th>`).join("")}</tr>`;
    const tfoot=`<tr class="ptot">${CP.ing.map((c2,k)=>`<td>${k===0?"TOTALES":c2[3]==="$"?money(ti[k]):""}</td>`).join("")}<td class="gap"></td>${CP.gas.map((c2,k)=>`<td>${k===0?"TOTALES":c2[3]==="$"?money(tg[k]):""}</td>`).join("")}</tr>`;
    const calcRows=isr.rows.map(([l,val,k,key])=>val===""&&k==="sub"?`<tr class="hd"><td colspan="2">${esc(l.toUpperCase())}</td></tr>`:`<tr class="${k==="total"?"ptot":""}${key?" y":""}"><td>${esc(l.toUpperCase())}</td><td>${typeof val==="number"?sm(val):esc(val)}</td></tr>`).join("");
    const iv=r.iva;
    return`<section class="pp">
      <header><div><h1>${esc(c.nombre.toUpperCase())}</h1><p><b>PRECIERRE CORRESPONDIENTE AL MES DE:</b> ${MESES[m-1].toUpperCase()} ${YEAR}</p><p><b>FECHA DEL REPORTE:</b> ${fechaLarga()}</p>
        <p><b>RÉGIMEN:</b> ${esc(REGS[reg].n.toUpperCase())}${reg==="601"?" · "+esc((c.actividad||"Empresarial").toUpperCase())+" · <b>COEFICIENTE:</b> "+num(c.coef).toFixed(4):""}</p>
        <p><span class="tag ${ok?"ok":"pend"}">${ok?"PRECIERRE ACTUALIZADO":"PRECIERRE PENDIENTE POR ACTUALIZAR"}</span></p></div>
        <table class="box"><tr><td>ISR PROBABLE</td><td>${money(isr.pago)}</td></tr><tr><td>IVA PROBABLE</td><td>${money(Math.max(0,v.iva))}</td></tr>${CP.pf?"":`<tr><td>RETENCIONES</td><td>${money(v.ret)}</td></tr>`}<tr class="ptot"><td>TOTAL</td><td>${money(v.total)}</td></tr><tr><td>IVA A FAVOR</td><td>${money(v.ivaFavor)}</td></tr></table></header>
      <p class="ley">C = DE CONTADO · 1 = CRÉDITO (NO PAGADO) · MA = COMPLEMENTO DE PAGO (COBRO DE MESES ANTERIORES)</p>
      <table class="mov"><thead>${thead}</thead>
        <tbody>${filas}${tfoot}</tbody></table>
      <div class="cols">${vistaCliente()?"":`<table class="calc"><thead><tr><th colspan="2">CÁLCULO DE ISR</th></tr></thead><tbody>${calcRows}</tbody></table>`}
        <table class="calc"><thead><tr><th colspan="2">IVA</th></tr></thead><tbody><tr><td>IVA TRASLADADO (COBRADO)</td><td>${money(iv.tras)}</td></tr><tr><td>MENOS: IVA RETENIDO</td><td>${sm(-iv.ret)}</td></tr><tr><td>MENOS: IVA ACREDITABLE</td><td>${sm(-iv.acred)}</td></tr><tr class="y"><td>MENOS: SALDO A FAVOR ANTERIOR</td><td>${sm(-iv.ant)}</td></tr><tr class="ptot"><td>${iv.neto>=0?"IVA A PAGAR":"IVA A FAVOR"}</td><td>${money(Math.abs(iv.neto))}</td></tr>
        ${r.ret>0.005?`<tr class="hd"><td colspan="2">RETENCIONES A ENTERAR</td></tr><tr><td>ISR RETENIDO A PROVEEDORES</td><td>${money(r.G.isrRet)}</td></tr><tr><td>IVA RETENIDO A PROVEEDORES</td><td>${money(r.G.ivaRet)}</td></tr><tr class="ptot"><td>TOTAL</td><td>${money(r.ret)}</td></tr>`:""}</tbody></table></div>
      <p class="pie">Generado con la app de Sol-EMP Soluciones Empresariales · Impuesto probable: el monto final lo confirma el despacho.</p></section>`}).join("");
}

/* ================= XML del SAT ================= */
async function importar(files){
  const c=S.clientes[S.cid];if(!c)return;
  if(!c.rfc){S.importAnio=false;toast(esAdmin()?"Para subir XML agrega primero el RFC del cliente (toca Editar).":"Para subir XML tu contador debe agregar tu RFC.");return}
  const anio=!!S.importAnio&&esAdmin();S.importAnio=false;
  if(!anio&&!puedeCapturar(c.id,S.m)){toast("La captura de este mes está cerrada.");return}
  toast("Leyendo archivos…",60000);
  const raw=await leerArchivos(files),docs=[];let mal=0;
  for(const r of raw){if(r.err){mal++;continue}try{docs.push(parseCFDI(r.text))}catch(e){mal++}}
  docs.sort((x,y)=>x.fecha.localeCompare(y.fecha));
  const rfc=(c.rfc||"").toUpperCase(),ya=new Set(Object.values(S.movs).filter(x=>x.cliente_id===c.id&&x.uuid_cfdi).map(x=>x.uuid_cfdi));
  const R={ok:0,rep:0,otroMes:0,otroAnio:0,cerrado:0,ajeno:0,otros:0,mal},porMes={};
  try{
    for(const d of docs){
      if(d.tipo!=="I"&&d.tipo!=="E"){R.otros++;continue}
      const tipo=d.emRfc===rfc?"ingreso":d.reRfc===rfc?"gasto":null;
      if(!tipo){R.ajeno++;continue}
      const mes=+d.fecha.slice(5,7);
      if(+d.fecha.slice(0,4)!==YEAR){R.otroAnio++;continue}
      if(!anio&&mes!==S.m){R.otroMes++;continue}
      if(!puedeCapturar(c.id,mes)){R.cerrado++;continue}
      if(d.uuid&&ya.has(d.uuid)){R.rep++;continue}
      const sg=d.tipo==="E"?-1:1;
      const m={cliente_id:c.id,anio:YEAR,mes,fecha:d.fecha,tipo,estatus:tipo==="ingreso"?(d.metodo==="PPD"?"I":"C"):null,regimen:(c.regimenes||[])[0],concepto:(d.tipo==="E"?"Nota de crédito · ":"")+(tipo==="ingreso"?d.reNom:d.emNom)+(d.folio?" · "+d.folio:""),
        rfc:tipo==="ingreso"?d.reRfc:d.emRfc,subtotal:sg*(d.subtotal-d.descuento),iva:sg*d.iva,iva_ret:sg*d.ivaRet,isr_ret:sg*d.isrRet,deducible:true,uuid_cfdi:d.uuid||null,capturado_por:esAdmin()?"admin":"cliente"};
      const saved=await API.saveMov(m,S.auth);["subtotal","iva","iva_ret","isr_ret"].forEach(k=>saved[k]=+saved[k]);
      S.movs[saved.id]=saved;if(d.uuid)ya.add(d.uuid);R.ok++;porMes[mes]=(porMes[mes]||0)+1;
      if(R.ok%5===0)toast("Guardando "+R.ok+"…",60000);
    }
  }catch(e){toast(errTxt(e),5000)}
  $("#toast").classList.remove("on");render();
  const meses=Object.keys(porMes).map(Number).sort((x,y)=>x-y);
  const li=[[anio?"Facturas agregadas":"Agregadas a "+MESES[S.m-1].toLowerCase(),R.ok]];
  if(R.rep)li.push(["Ya estaban registradas",R.rep]);if(R.otroMes)li.push(["Son de otro mes (usa “Subir el año completo”)",R.otroMes]);
  if(R.otroAnio)li.push(["Son de otro año",R.otroAnio]);if(R.cerrado)li.push(["Su mes ya está declarado (no se tocaron)",R.cerrado]);
  if(R.ajeno)li.push(["No son de este RFC",R.ajeno]);if(R.otros)li.push(["Pagos, nómina u otros (no se usan)",R.otros]);if(R.mal)li.push(["Archivos no válidos",R.mal]);
  const pend=anio?MESES.map((n,i)=>i+1).filter(m=>m<S.m&&periodo(c.id,m).estado!=="declarado"&&movsDe(c.id,m).length):[];
  openSheet("Carga terminada",`<dl class="kv">${li.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
    ${meses.length>1||anio?`<div class="stack" style="gap:6px"><b>Facturas por mes</b><div class="tags">${meses.map(m=>`<span class="chip">${MESES[m-1].slice(0,3)} · ${porMes[m]}</span>`).join("")||'<span class="small muted">Ninguna nueva</span>'}</div></div>`:""}
    ${pend.length?`<div class="card stack" style="padding:16px;gap:8px"><b>¿Esos meses ya los declaraste?</b><span class="small muted">Si ya presentaste ${pend.length===1?"ese mes":"esos meses"} en el SAT (${pend.map(m=>MESES[m-1].slice(0,3)).join(", ")}), márcalos como declarados: sus pagos se restan solos en los meses siguientes y quedan cerrados.</span>
      <button class="btn primary full" data-act="declararAnteriores">Marcar ${pend.length===1?"ese mes":"esos "+pend.length+" meses"} como declarados</button></div>`:""}
    <button class="btn ${pend.length?"":"primary "}full" data-act="close">Ver la hoja</button>`);
}

  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const Z=256,cv=document.createElement("canvas");cv.width=cv.height=Z;const x=cv.getContext("2d"),m=Math.min(img.naturalWidth,img.naturalHeight);
    x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,Z,Z);return cv.toDataURL("image/jpeg",.82)}
  finally{URL.revokeObjectURL(url)}
}

    if(d.id)c.id=d.id;
    $("#sheet").hidden=true;S.confirm=null;
    try{const s=await API.saveCliente(c);S.clientes[s.id]=normCliente(Object.assign({},c,s));if(!prev){S.vista="tablero";scrollTo(0,0)}toast(prev?"Empresa actualizada":"Cliente creado: ya aparece en la tabla")}catch(er){toast(errTxt(er),5000)}
    render();return;
  }
  if(fid==="fPerfil"){
    const row={email:S.auth.email,nombre:(d.nombre||"").trim()||null,foto:S.fotoNueva===undefined?((S.auth.perfil&&S.auth.perfil.foto)||null):S.fotoNueva,actualizado:new Date().toISOString()};
    try{const sv=await API.savePerfil(row);S.auth.perfil=sv||row;if(row.nombre)S.auth.nombre=row.nombre;closeSheet();toast("✓ Perfil guardado",2500)}catch(er){toast(/perfiles/.test(errTxt(er))?"Falta correr el SQL nuevo en Supabase para guardar el perfil.":errTxt(er),5000)}
    return;
  }
  if(fid==="fAdmin"){
    if((d.conf||"").trim().toUpperCase()!=="ADMINISTRADOR"){toast("Escribe ADMINISTRADOR para confirmar");return}
    try{await API.ponerAcceso(fm.dataset.e,"admin");closeSheet();toast("✓ "+fm.dataset.e+" ahora es administrador",3500);await cargarCuentas()}catch(er){toast(errTxt(er),5000)}
    return;
  }
  if(fid==="fPersona"){
    const x=fm.dataset.e,nom=(d.nombre||"").trim();if(!nom){toast("Escribe el nombre");return}
    const pf=(S.cuentas&&S.cuentas.perfiles||[]).find(f=>(f.email||"").toLowerCase()===x)||{};
    try{
      await API.savePerfil({email:x,nombre:nom,foto:pf.foto||null,actualizado:new Date().toISOString()});
      for(const c of Object.values(S.clientes).filter(c=>(c.email_cliente||"").toLowerCase()===x&&c.titular!==nom)){const n=clone(c);n.titular=nom;const sv=await API.saveCliente(n);S.clientes[c.id]=normCliente(Object.assign({},n,sv||{}))}
      if(x===S.auth.email){S.auth.perfil=Object.assign({},S.auth.perfil||{},{email:x,nombre:nom});S.auth.nombre=nom}
      closeSheet();toast("✓ Nombre guardado",2500);await cargarCuentas();
    }catch(er){toast(errTxt(er),5000)}
    return;
  }
  if(fid==="fAcceso"){
    const em=(d.email||"").trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast("Escribe un correo válido");return}
    d.rol="cliente";
    try{await API.ponerAcceso(em,d.rol);toast("✓ "+em+" activado como "+(d.rol==="admin"?"administrador":"cliente"),3500);await cargarCuentas()}catch(er){toast(errTxt(er),5000)}
    return;
  }
  if(fid==="fTarifas"){
    const g=k=>num(d[k]),n=CFG.tarifaPF.length,nr=CFG.resicoPFli.length;
    const nuevo={tasaPM:g("tasaPM"),iva:g("iva"),limPM:g("limPM"),limPF:g("limPF"),retAut:g("retAut"),retIvaPF:g("retIvaPF"),retIsrPF:g("retIsrPF"),retIsrResico:g("retIsrResico"),
      tarifaPF:Array.from({length:n},(_,i)=>[g("t_li_"+i),g("t_cf_"+i),g("t_pc_"+i)]),resicoPFli:Array.from({length:nr},(_,i)=>[g("r_h_"+i),g("r_p_"+i)])};
    if(!(nuevo.tasaPM>0&&nuevo.tasaPM<100)){toast("Revisa la tasa de ISR de personas morales.");return}
    try{await API.saveConfig(nuevo);CFG=Object.assign(clone(CFG_BASE),nuevo);toast("Tablas y tarifas guardadas")}catch(er){toast("No se guardó: falta correr el SQL nuevo en Supabase.",6000);return}
    S.vista="tablero";render();scrollTo(0,0);return;
  }
  if(fid==="fMov"){
    const c=S.clientes[S.cid],sub=num(d.subtotal),prev=d.id?S.movs[d.id]:null,otro=e.submitter&&e.submitter.value==="otro";
    if(!(sub>0)){toast("Escribe el importe sin IVA.");return}
    const mes=+d.fecha.slice(5,7),ing=d.tipo==="ingreso",estatus=ing?(d.estatus||"C"):null,tasa=d.tasa_iva||"16";
    const iva=tasa==="manual"?num(d.iva):tasa==="16"?Math.round(sub*CFG.iva)/100:0;
    let ivr=num(d.iva_ret),isr=num(d.isr_ret);
    if(ing&&!S.retManual){const r=retDe(c,sub,estatus,S.retOn);ivr=r.iva;isr=r.isr}
    if(ing&&estatus==="I"){ivr=0;isr=0}
    const m=Object.assign({},prev||{},{cliente_id:c.id,anio:YEAR,mes,fecha:d.fecha,tipo:d.tipo,regimen:d.regimen||regDe(c),concepto:d.concepto.trim(),rfc:(d.rfc||"").trim().toUpperCase(),
      estatus,subtotal:sub,iva,iva_ret:ivr,isr_ret:isr,tasa_iva:tasa,ref_id:d.ref_id||null,
      deducible:ing?true:!!d.deducible,capturado_por:prev?prev.capturado_por:(esAdmin()?"admin":"cliente"),nota:(d.nota||"").trim()||null});
    if(d.id)m.id=d.id;else delete m.id;
    try{const s=await API.saveMov(m,S.auth);["subtotal","iva","iva_ret","isr_ret"].forEach(k=>s[k]=+s[k]);S.movs[s.id]=Object.assign({},m,s);
      if(otro){S.mov={tipo:d.tipo};S.confirm=null;render();formMov(null);toast("Guardado. Agrega el siguiente "+(ing?"ingreso":"gasto"));return}
      toast(prev?"Actualizado":"Guardado")}catch(er){toast(errTxt(er),5000);return}
    $("#sheet").hidden=true;S.confirm=null;S.mov=null;render();
  }
});

/* ================= Arranque ================= */
async function iniciar(){
  try{if(window.claude&&typeof window.claude.use==="function")DL=await window.claude.use("downloads")}catch(e){}
  if(!MODO_DEMO){try{await getSb()}catch(e){toast(e.message,6000)}}
  const h=location.hash||"";
  if(/access_token|type=signup|type=recovery|type=magiclink/.test(h))S.sec="trabajo";
  if(/error_code=otp_expired|error=access_denied/.test(h)){S.sec="trabajo";setTimeout(()=>toast("Ese enlace ya expiró o ya se usó. Si ya confirmaste tu correo, entra con tu contraseña.",7000),3600)}
  try{const s=await API.session();if(s){S.auth=s;await recargar();if(/access_token|type=signup/.test(h))setTimeout(()=>toast("Correo confirmado. ¡Bienvenido!",4000),3600)}}
  catch(e){if(S.auth)toast(errTxt(e),6000)}
  if(S.sec==="trabajo"&&!/^#trabajo$/.test(location.hash)){try{history.replaceState(null,"",location.pathname+"#trabajo")}catch(e){}}
  S.listo=true;render();
}
let DL=null;
document.getElementById("spSw").src=LG_SW;document.getElementById("spDk").src=LG_DARK;document.getElementById("spEm").src=LG_EMP;
{const sh=document.getElementById("spSh");sh.style.webkitMaskImage=sh.style.maskImage="url("+LOGO+")";}
render();
iniciar();
setTimeout(()=>{const sp=document.getElementById("splash");if(sp)sp.remove()},3500);
setTimeout(()=>$("#app").classList.remove("intro"),4300);
document.addEventListener("gesturestart",e=>e.preventDefault());
if(!window.claude&&"serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})}).catch(()=>{});
  let recargado=false;const habia=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(habia&&!recargado){recargado=true;location.reload()}})}
</script>
